function sigPad(host){
  host.innerHTML='<canvas class="pad" aria-label="Khung ký tên"></canvas><div class="row" style="margin-top:8px"><button type="button" class="btn sm" data-clear>Xoá, ký lại</button><span class="hint">Dùng ngón tay hoặc chuột ký trong khung.</span></div>';
  const cv=host.querySelector('canvas'),ctx=cv.getContext('2d');
  let drawing=false,dirty=false,last=null,bb=null;
  const fit=()=>{const r=cv.getBoundingClientRect(),k=window.devicePixelRatio||1;cv.width=Math.max(1,Math.round(r.width*k));cv.height=Math.max(1,Math.round(r.height*k));ctx.setTransform(k,0,0,k,0,0);ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#0b1f5c';};
  requestAnimationFrame(fit);
  const pt=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
  const grow=p=>{bb=bb?[Math.min(bb[0],p[0]),Math.min(bb[1],p[1]),Math.max(bb[2],p[0]),Math.max(bb[3],p[1])]:[p[0],p[1],p[0],p[1]];};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();if(cv.width<=1)fit();cv.setPointerCapture(e.pointerId);drawing=true;last=pt(e);grow(last);ctx.beginPath();ctx.arc(last[0],last[1],1.2,0,7);ctx.fillStyle='#0b1f5c';ctx.fill();dirty=true;});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=pt(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();grow(p);last=p;});
  const up=()=>{drawing=false;};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  host.querySelector('[data-clear]').onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);dirty=false;bb=null;};
  return {empty:()=>!dirty||!bb||(bb[2]-bb[0]<12&&bb[3]-bb[1]<12),data:()=>{
    const k=window.devicePixelRatio||1,pd=6;
    const x=Math.max(0,(bb[0]-pd)*k),y=Math.max(0,(bb[1]-pd)*k),w=Math.min(cv.width-x,(bb[2]-bb[0]+2*pd)*k),h=Math.min(cv.height-y,(bb[3]-bb[1]+2*pd)*k);
    const s=Math.min(1,380/w),o=document.createElement('canvas');o.width=Math.max(1,Math.round(w*s));o.height=Math.max(1,Math.round(h*s));
    o.getContext('2d').drawImage(cv,x,y,w,h,0,0,o.width,o.height);return o.toDataURL('image/png');}};
}

async function initFirebase(){
  const B='https://www.gstatic.com/firebasejs/10.14.1/';
  const [A,Au,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
  const app=A.initializeApp(FB_CONFIG),auth=Au.getAuth(app),fs=F.getFirestore(app);
  const D=p=>F.doc(fs,...p.split('/'));
  const norm=d=>({...d,createdAt:d.createdAt&&d.createdAt.toMillis?d.createdAt.toMillis():(d.createdAt||Date.now())});
  return {
    onAuth:cb=>Au.onAuthStateChanged(auth,u=>cb(u?{uid:u.uid,email:(u.email||'').toLowerCase(),name:u.displayName||u.email,photo:u.photoURL||''}:null)),
    signIn:()=>Au.signInWithPopup(auth,new Au.GoogleAuthProvider()),
    signOut:()=>Au.signOut(auth),
    getAllowed:async e=>{const s=await F.getDoc(D('allowed/'+e));return s.exists()?s.data():null;},
    listAllowed:async()=>(await F.getDocs(F.collection(fs,'allowed'))).docs.map(d=>({email:d.id,...d.data()})),
    setAllowed:(e,o)=>F.setDoc(D('allowed/'+e),o),
    delAllowed:e=>F.deleteDoc(D('allowed/'+e)),
    getProfile:async u=>{const s=await F.getDoc(D('profiles/'+u));return s.exists()?s.data():null;},
    saveProfile:(u,o)=>F.setDoc(D('profiles/'+u),o,{merge:true}),
    createSlip:async o=>(await F.addDoc(F.collection(fs,'slips'),{...o,createdAt:F.serverTimestamp()})).id,
    getSlip:async id=>{const s=await F.getDoc(D('slips/'+id));return s.exists()?{id,...norm(s.data())}:null;},
    watchSlip:(id,cb,err)=>F.onSnapshot(D('slips/'+id),s=>cb(s.exists()?{id,...norm(s.data())}:null),err),
    listSlips:async()=>(await F.getDocs(F.query(F.collection(fs,'slips'),F.orderBy('createdAt','desc'),F.limit(300)))).docs.map(d=>({id:d.id,...norm(d.data())})),
    updateSlip:(id,o)=>F.updateDoc(D('slips/'+id),{...o,updatedAt:F.serverTimestamp()})
  };
}
function initMock(){

    watchSlip:(id,cb)=>{const w={id,cb};ws.push(w);setTimeout(()=>push(id),0);return()=>{ws.splice(ws.indexOf(w),1);};},
    listSlips:async()=>Object.entries(ld().slips).map(([id,s])=>({id,...s})).sort((a,b)=>b.createdAt-a.createdAt),
    updateSlip:async(id,o)=>{const d=ld();d.slips[id]={...d.slips[id],...o,updatedAt:Date.now()};sv(d);push(id);}

}

let C=null,padObj=null;
const freshC=()=>({kind:'A',A:{head:{ngay:today()},sel:{},custom:[]},B:{head:{ngay:today()},sel:{},custom:[]},signer:''});
function viewCreate(){
  if(!C)C=freshC();
  app.innerHTML=`<div class="eyebrow">Không cần đăng nhập</div><h2 style="margin:4px 0 0;font-size:26px;color:var(--navy)">Tạo phiếu mới</h2>
  <section class="panel"><h2><i>1</i>Chọn phiếu</h2><div class="tabs" role="group" aria-label="Chọn mẫu phiếu">
   <button id="tabA"><b>${FORMS.A.name}</b><span>${FORMS.A.sub}</span></button><button id="tabB"><b>${FORMS.B.name}</b><span>${FORMS.B.sub}</span></button></div></section>
  <section class="panel"><h2><i>2</i>Thông tin phiếu</h2><div id="head" class="grid"></div></section>

   <div id="eqlist" style="display:flex;flex-direction:column;gap:10px"></div>

   <div class="row"><button class="btn sm" id="addRow">+ Thêm thiết bị khác</button><span id="pageInfo" class="hint"></span></div></section>
  <section class="panel"><h2><i>4</i>Ký tên người lập phiếu</h2>
   <label class="f" for="signer">Họ và tên người ký<input id="signer" autocomplete="name" placeholder="Nhập họ tên đầy đủ" value="${esc(C.signer)}"></label>
   <div id="padHost"></div></section>
  <section class="panel"><h2><i>5</i>Xem trước và gửi duyệt</h2><div class="pvbox" id="pvbox"><div class="pvin" id="pv"></div></div>
   <div class="row"><button class="btn red" id="submit">Ký và gửi duyệt</button><span id="msg" class="msg" hidden></span></div>
   <p class="hint">Sau khi gửi, phiếu chuyển đến ${esc(FORMS.A.chain[1][1])} ký tiếp. Bạn có thể gửi link phiếu cho các cấp qua Zalo.</p></section>`;
  padObj=sigPad($('padHost'));
  const st=()=>C[C.kind],F=()=>FORMS[C.kind];
  const info=()=>{const n=itemsOf(st()).length,pages=Math.max(1,Math.ceil(n/F().per));$('selInfo').textContent=n?`Đã chọn ${n} thiết bị`:'Chưa chọn thiết bị nào';$('pageInfo').textContent=`Mỗi trang có ${F().per} dòng. Hiện ${pages} trang.`;};
  const paint=()=>{const steps=newSteps(C.kind);$('pv').innerHTML=sheetsHtml(C.kind,st().head,itemsOf(st()),steps,null);fitPreview($('pvbox'));info();};
  const renderHead=()=>{
    $('tabA').setAttribute('aria-pressed',C.kind==='A');$('tabB').setAttribute('aria-pressed',C.kind==='B');
    $('head').innerHTML=F().head.map(([k,l,t])=>{
      const v=st().head[k]||'';
      if(LISTS[t]){const list=LISTS[t],other=st().head['_o_'+k]||(v&&!list.includes(v));
        return `<div style="display:flex;flex-direction:column;gap:4px"><label class="f" for="h-${k}">${l}<select id="h-${k}" data-s="${k}"><option value="">— Chọn —</option>${list.map(x=>`<option ${!other&&v===x?'selected':''}>${esc(x)}</option>`).join('')}<option value="__other" ${other?'selected':''}>Khác (nhập tên)</option></select></label>${other?`<input data-h="${k}" aria-label="${l} - nhập tên khác" placeholder="Nhập tên" value="${esc(v)}">`:''}</div>`;}
      const rq=F().req.includes(k);
      return `<label class="f" for="h-${k}">${l}${rq?' <b style="color:var(--bad)" aria-hidden="true">*</b>':''}<input id="h-${k}" data-h="${k}" type="${t}" ${rq?'required aria-required="true"':''} value="${esc(v)}" ${k==='cmnd'?'autocomplete="off" inputmode="numeric"':''}></label>`;}).join('');
  };
  const itemHtml=c=>{const x=st().sel[c[0]]||{},on=!!x.on;
    return `<div class="item ${on?'on':''}" data-code="${c[0]}"><label class="pick" for="c-${c[0]}"><input type="checkbox" id="c-${c[0]}" ${on?'checked':''}><span class="code">${esc(c[0])}</span><span class="nm">${esc(c[1])}</span><span class="u">${esc(c[2])}</span></label><input class="qty" id="q-${c[0]}" inputmode="decimal" placeholder="SL" enterkeyhint="done" aria-label="Số lượng ${esc(c[1])}" value="${esc(x.sl||'')}"></div>`;};
  const renderList=()=>{const q=($('q').value||'').toLowerCase().trim();
    const items=CAT.filter(c=>!q||(c[0]+' '+c[1]+' '+grpOf(c[0])).toLowerCase().includes(q));
    const groups=[...new Set(items.map(c=>grpOf(c[0])))];
    $('eqlist').innerHTML=groups.map(g=>`<div><h3 class="g" style="margin-bottom:6px">${esc(g)}</h3><div class="list">${items.filter(c=>grpOf(c[0])===g).map(itemHtml).join('')}</div></div>`).join('')||'<p class="hint">Không có thiết bị khớp. Thêm ở mục thiết bị khác bên dưới.</p>';};
  const renderCustom=()=>{$('custom').innerHTML=st().custom.map((r,i)=>`<div class="rowcard" data-i="${i}"><div class="h"><span>Thiết bị khác ${i+1}</span><button class="btn sm" data-del="1">Xoá</button></div>
   <label class="f name">Tên thiết bị / vật tư<input data-c="ten" autocomplete="off" value="${esc(r.ten||'')}"></label>
   <label class="f">ĐVT<input data-c="dvt" value="${esc(r.dvt||'')}"></label><label class="f">Số lượng<input data-c="sl" inputmode="decimal" value="${esc(r.sl||'')}"></label></div>`).join('');};
  const all=()=>{renderHead();renderList();renderCustom();paint();};
  $('tabA').onclick=()=>{C.kind='A';all();};$('tabB').onclick=()=>{C.kind='B';all();};
  $('head').addEventListener('input',e=>{if(e.target.dataset.h){e.target.classList.remove('invalid');st().head[e.target.dataset.h]=e.target.value;paint();}});
  $('head').addEventListener('change',e=>{const k=e.target.dataset.s;if(!k)return;
    if(e.target.value==='__other'){st().head['_o_'+k]=true;st().head[k]='';renderHead();const o=$('head').querySelector(`[data-h="${k}"]`);if(o)o.focus();}
    else{st().head['_o_'+k]=false;st().head[k]=e.target.value;renderHead();}paint();});
  $('q').oninput=renderList;
  $('eqlist').addEventListener('change',e=>{const it=e.target.closest('.item');if(!it||e.target.type!=='checkbox')return;const code=it.dataset.code;st().sel[code]=st().sel[code]||{};st().sel[code].on=e.target.checked;it.classList.toggle('on',e.target.checked);if(e.target.checked)it.querySelector('.qty').focus();paint();});
  $('eqlist').addEventListener('input',e=>{if(!e.target.classList.contains('qty'))return;const it=e.target.closest('.item'),code=it.dataset.code;st().sel[code]=st().sel[code]||{};e.target.value=onlyNum(e.target.value);st().sel[code].sl=e.target.value;
    if(e.target.value.trim()&&!st().sel[code].on){st().sel[code].on=true;it.querySelector('input[type=checkbox]').checked=true;it.classList.add('on');}paint();});
  $('custom').addEventListener('input',e=>{const c=e.target.dataset.c;if(!c)return;if(c==='sl')e.target.value=onlyNum(e.target.value);st().custom[+e.target.closest('.rowcard').dataset.i][c]=e.target.value;paint();});
  $('custom').addEventListener('click',e=>{if(e.target.closest('[data-del]')){st().custom.splice(+e.target.closest('.rowcard').dataset.i,1);renderCustom();paint();}});
  $('addRow').onclick=()=>{st().custom.push({});renderCustom();paint();const l=$('custom').lastElementChild;if(l)l.querySelector('input').focus();};
  $('signer').oninput=e=>{C.signer=e.target.value;};
  const setMsg=(t,k)=>{const m=$('msg');m.hidden=!t;m.textContent=t||'';m.className='msg '+(k||'');};
  $('submit').onclick=async()=>{
    const s=st(),f=F(),kind=C.kind;
    const miss=f.req.filter(k=>!String(s.head[k]||'').trim());
    document.querySelectorAll('#head .invalid').forEach(x=>x.classList.remove('invalid'));
    if(miss.length){miss.forEach(k=>{const el=$('h-'+k);if(el)el.classList.add('invalid');});setMsg('Bắt buộc điền: '+miss.map(k=>f.head.find(h=>h[0]===k)[1]).join(', ')+'.','err');const el=$('h-'+miss[0]);if(el){el.scrollIntoView({block:'center'});el.focus();}return;}
    const items=itemsOf(s);
    if(!items.length){setMsg('Tick ít nhất một thiết bị.','err');return;}
    if(items.some(i=>!String(i.sl).trim())){setMsg('Còn thiết bị đã tick nhưng chưa điền số lượng.','err');return;}
    if(!C.signer.trim()){setMsg('Nhập họ tên người ký.','err');$('signer').classList.add('invalid');$('signer').focus();return;}
    if(padObj.empty()){setMsg('Chưa có chữ ký. Ký trong khung phía trên.','err');$('padHost').scrollIntoView({block:'center'});return;}
    $('submit').disabled=true;setMsg('Đang gửi phiếu…');
    try{
      const steps=newSteps(kind);steps[0]={...steps[0],name:C.signer.trim(),sig:padObj.data(),at:new Date().toISOString(),guest:true};
      const head={};Object.entries(s.head).forEach(([k,v])=>{if(!k.startsWith('_o_')&&typeof v==='string'&&v.trim())head[k]=v.trim();});
      const slip={type:kind,code:newCode(kind),head,items:items.map(i=>({...i,sl:String(i.sl)})),steps,currentStep:1,status:'pending',createdByName:C.signer.trim()};
      const id=await DB.createSlip(slip);
      remember({id,code:slip.code,doi:head.doi||head.don_vi||'',at:new Date().toISOString()});
      C=null;toast('Đã gửi phiếu, chờ '+steps[1].label+' ký.');location.hash='#/phieu/'+id;
    }catch(e){setMsg('Không gửi được phiếu: '+(e.code||e.message||'lỗi'),'err');$('submit').disabled=false;}
  };
  all();
}

/* ===================== Xuất file ===================== */
async function deliverFile(name,blob,mime){
  const file=new File([blob],name,{type:mime});const url=URL.createObjectURL(blob);
  let canShare=false;try{canShare=!!(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]}));}catch(e){}
  const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const dl=()=>{const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();};
  const p=modal(`<h3>Đã tạo xong file</h3><p class="hint" style="color:var(--ink)">Tên file: <b>${esc(name)}</b><br>${canShare?'Bấm "Gửi / Lưu file" để gửi qua Zalo hoặc lưu vào ứng dụng Tệp (Files). ':''}${mobile?'Nếu bấm "Tải xuống", file nằm trong thư mục Tải xuống (Downloads) của điện thoại, xem trong ứng dụng Tệp / My Files.':'File nằm trong thư mục Tải xuống (Downloads) của máy.'}</p>
   <div class="row">${canShare?'<button class="btn red" id="fShare">Gửi / Lưu file (Zalo, Tệp…)</button>':''}<button class="btn blue" id="fDl">Tải xuống</button>${mime==='application/pdf'?'<button class="btn" id="fOpen">Mở xem</button>':''}<button class="btn" data-m="x">Đóng</button></div>`);
  if($('fShare'))$('fShare').onclick=()=>navigator.share({files:[file],title:name}).catch(()=>{});
  $('fDl').onclick=dl;if($('fOpen'))$('fOpen').onclick=()=>window.open(url,'_blank');
  if(!canShare)dl();
  await p;
}
async function exportPdf(s){
  const F=FORMS[s.type];toast('Đang tạo PDF…');
  try{
    if(typeof html2canvas==='undefined'||!window.jspdf)throw new Error('chưa tải được thư viện tạo PDF, kiểm tra mạng rồi thử lại');
    $('print').innerHTML=sheetsHtml(s.type,s.head,s.items,s.steps,s);
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    const els=[...$('print').querySelectorAll('.sheet')];
    for(let i=0;i<els.length;i++){const cv=await html2canvas(els[i],{scale:2,backgroundColor:'#ffffff',useCORS:true});if(i)pdf.addPage();pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297);}
    const w=who(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
    await deliverFile([F.file,w,s.code].filter(Boolean).join('_')+'.pdf',pdf.output('blob'),'application/pdf');
  }catch(e){toast('Không tạo được PDF: '+(e.message||'lỗi'));}
}
async function exportXlsx(list){
  if(typeof ExcelJS==='undefined'){toast('Chưa tải được thư viện Excel, kiểm tra mạng.');return;}
  const wb=new ExcelJS.Workbook();wb.creator='Phiếu điện tử HH12';
  const hdr=ws=>{const r=ws.getRow(1);r.font={bold:true,color:{argb:'FFFFFFFF'}};r.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF0B2545'}};r.alignment={vertical:'middle',horizontal:'center',wrapText:true};r.height=30;ws.views=[{state:'frozen',ySplit:1}];};
  const w1=wb.addWorksheet('Danh sách phiếu');
  w1.columns=[{header:'Mã phiếu',key:'c',width:20},{header:'Loại phiếu',key:'t',width:26},{header:'Ngày lập',key:'d',width:12},{header:'Số phiếu',key:'so',width:12},{header:'Hạng mục',key:'hm',width:18},{header:'Đội / Đơn vị',key:'doi',width:22},{header:'Trạng thái',key:'st',width:22},{header:'Số dòng thiết bị',key:'n',width:12},{header:'Người lập',key:'s0',width:26},{header:'Thủ kho',key:'s1',width:26},{header:'GS. TCTC / GS. Phụ trách',key:'s2',width:26},{header:'GS. Phụ trách / CHT',key:'s3',width:26},{header:'CHT / An ninh cổng',key:'s4',width:26},{header:'Lý do từ chối',key:'rj',width:28}];
  const w2=wb.addWorksheet('Chi tiết thiết bị');
  w2.columns=[{header:'Mã phiếu',key:'c',width:20},{header:'Loại phiếu',key:'t',width:26},{header:'Ngày lập',key:'d',width:12},{header:'Đội / Đơn vị',key:'doi',width:22},{header:'Trạng thái',key:'st',width:20},{header:'Tên thiết bị',key:'ten',width:34},{header:'ĐVT',key:'dvt',width:8},{header:'Số lượng',key:'sl',width:11}];
  list.forEach(s=>{
    const sg=x=>x&&x.sig?`${x.name} (${fmtDT(x.at)})`:'';const stt=s.status==='pending'&&cur(s)?'Chờ '+cur(s).label:STATUS[s.status];
    w1.addRow({c:s.code,t:FORMS[s.type].name,d:fmtD(s.head.ngay),so:s.head.so||'',hm:s.head.hang_muc||'',doi:who(s),st:stt,n:s.items.length,s0:sg(s.steps[0]),s1:sg(s.steps[1]),s2:sg(s.steps[2]),s3:sg(s.steps[3]),s4:sg(s.steps[4]),rj:s.rejectReason||''});
    s.items.forEach(i=>w2.addRow({c:s.code,t:FORMS[s.type].name,d:fmtD(s.head.ngay),doi:who(s),st:stt,ten:i.ten,dvt:i.dvt,sl:isNaN(parseFloat(String(i.sl).replace(',','.')))?i.sl:parseFloat(String(i.sl).replace(',','.'))}));
  });
  hdr(w1);hdr(w2);[w1,w2].forEach(ws=>{ws.eachRow((r,n)=>{if(n>1)r.eachCell(c=>{c.border={top:{style:'thin',color:{argb:'FFCFD8E6'}},bottom:{style:'thin',color:{argb:'FFCFD8E6'}},left:{style:'thin',color:{argb:'FFCFD8E6'}},right:{style:'thin',color:{argb:'FFCFD8E6'}}};c.alignment={vertical:'middle',wrapText:true};});});});
  const buf=await wb.xlsx.writeBuffer();
  await deliverFile('Tong-hop-phieu-HH12_'+today()+'.xlsx',new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

/* ===================== Xem phiếu, ký, từ chối ===================== */
function viewSlip(id){
  app.innerHTML='<div class="panel"><p class="hint">Đang tải phiếu…</p></div>';
  unwatch=DB.watchSlip(id,s=>renderSlip(s),e=>{app.innerHTML=`<div class="panel"><h2>Không mở được phiếu</h2><p class="hint">${esc(e&&e.code||'lỗi')}</p></div>`;});
}
function renderSlip(s){
  if(!s){app.innerHTML='<div class="panel"><h2>Không tìm thấy phiếu</h2><p class="hint">Link phiếu sai hoặc phiếu đã bị xoá.</p><a class="btn blue" href="#/">Về trang chủ</a></div>';return;}
  const F=FORMS[s.type],turn=isMyTurn(s);
  const tl=s.steps.map((x,i)=>{const done=!!x.sig,isCur=s.status==='pending'&&i===s.currentStep,rej=s.status==='rejected'&&i===s.currentStep;
    return `<li class="${done?'done':rej?'rej':isCur?'cur':''}"><span class="d">${done?'✓':rej?'✕':i+1}</span><div><b>${esc(x.label)}</b><small>${done?esc(x.name)+' · '+esc(fmtDT(x.at)):rej?'Từ chối':isCur?'Đang chờ ký':'Chưa đến lượt'}</small>${done?`<img src="${x.sig}" alt="Chữ ký ${esc(x.name)}">`:''}</div></li>`;}).join('');
  let act='';
  if(turn){act=`<div class="row"><button class="btn red" id="aSign">Ký duyệt</button><button class="btn line" id="aRej">Từ chối</button></div><p class="hint">Đến lượt bạn ký với vai trò <b>${esc(cur(s).label)}</b>.</p>`;}
  else if(s.status==='pending'){
    act=!U?`<p class="hint">Phiếu đang chờ <b>${esc(cur(s).label)}</b> ký. Cấp duyệt đăng nhập Google để ký.</p><div class="row"><button class="btn blue" id="aIn">Đăng nhập để ký</button></div>`
      :`<p class="hint">Phiếu đang chờ <b>${esc(cur(s).label)}</b> ký${ME.member?'. Chưa đến lượt vai trò của bạn.':'. Tài khoản của bạn chưa được cấp quyền ký.'}</p>`;}
  if(s.status==='rejected')act+=`<div class="msg err"><b>Phiếu bị từ chối</b>${s.rejectedBy?' bởi '+esc(s.rejectedBy):''}: ${esc(s.rejectReason||'không có lý do')}</div>`;
  if(s.status==='done')act+=`<div class="row"><button class="btn red" id="aPdf">Xuất PDF đã ký</button></div>`;
  app.innerHTML=`<a href="#/" class="hint">← Trang chủ</a>
   <div class="row" style="justify-content:space-between;margin-top:6px"><div><div class="eyebrow">${esc(F.name)}</div><h2 style="margin:2px 0 0;font-size:24px;color:var(--navy)">${esc(s.code)}</h2><span class="hint">${esc(who(s))} · lập lúc ${esc(fmtDT(s.createdAt))}</span></div>${badge(s)}</div>
   <section class="panel"><h2>Tiến trình ký</h2><ol class="tl">${tl}</ol>${act}
   <div class="row"><button class="btn sm" id="aCopy">Sao chép link phiếu</button><button class="btn sm" id="aShare">Gửi link qua Zalo…</button></div></section>
   <section class="panel"><h2>Nội dung phiếu</h2><div class="pvbox" id="pvbox"><div class="pvin" id="pv">${sheetsHtml(s.type,s.head,s.items,s.steps,s)}</div></div></section>`;
  fitPreview($('pvbox'));
  $('aCopy').onclick=async()=>{try{await navigator.clipboard.writeText(slipLink(s.id));toast('Đã sao chép link phiếu');}catch(e){prompt('Sao chép link:',slipLink(s.id));}};
  $('aShare').onclick=()=>{const u=slipLink(s.id);if(navigator.share)navigator.share({title:'Phiếu '+s.code,text:'Phiếu '+s.code+' cần ký',url:u}).catch(()=>{});else $('aCopy').click();};
  if($('aIn'))$('aIn').onclick=login;if($('aPdf'))$('aPdf').onclick=()=>exportPdf(s);
  if($('aSign'))$('aSign').onclick=()=>doSign(s);if($('aRej'))$('aRej').onclick=()=>doReject(s);
}
async function doSign(s){
  const sig=ME.profile&&ME.profile.signature;
  if(!sig){toast('Bạn chưa khai báo chữ ký.');location.hash='#/ho-so';return;}
  const p=modal(`<h3>Xác nhận ký</h3><p class="hint" style="color:var(--ink)">Bạn ký với vai trò <b>${esc(cur(s).label)}</b> cho phiếu <b>${esc(s.code)}</b> bằng chữ ký đã khai báo:</p><div class="sigprev"><img src="${sig}" alt="Chữ ký của bạn"></div>
   <label class="row" style="gap:8px"><input type="checkbox" id="chk" style="width:20px;height:20px;min-height:0"> Tôi đã kiểm tra nội dung phiếu</label><div class="row"><button class="btn ok" data-m="yes" id="yes" disabled>Ký</button><button class="btn" data-m="no">Huỷ</button></div>`);
  $('chk').onchange=e=>{$('yes').disabled=!e.target.checked;};
  if(await p!=='yes')return;
  try{
    const steps=s.steps.map((x,i)=>i===s.currentStep?{...x,name:ME.name,email:U.email,sig,at:new Date().toISOString()}:x);
    const last=s.currentStep===steps.length-1;
    await DB.updateSlip(s.id,{steps,currentStep:last?steps.length:s.currentStep+1,status:last?'done':'pending'});
    toast(last?'Đã ký xong, phiếu hoàn tất.':'Đã ký, chuyển cấp tiếp theo.');
  }catch(e){toast('Không ký được: '+(e.code||e.message));}
}
async function doReject(s){
  let val='';
  const p=modal(`<h3>Từ chối phiếu</h3><label class="f">Lý do từ chối (bắt buộc)<textarea id="rsn" placeholder="Ví dụ: sai số lượng RL-25, cần lập lại"></textarea></label><div class="row"><button class="btn red" id="rejGo">Từ chối phiếu</button><button class="btn" data-m="no">Huỷ</button></div>`);
  $('rejGo').onclick=()=>{val=$('rsn').value.trim();if(!val){toast('Nhập lý do từ chối.');return;}$('modal').__done('yes');};
  if(await p!=='yes')return;
  try{await DB.updateSlip(s.id,{status:'rejected',rejectReason:val,rejectedBy:ME.name});toast('Đã từ chối phiếu.');}
  catch(e){toast('Không từ chối được: '+(e.code||e.message));}
}

/* ===================== Danh sách duyệt, tất cả phiếu ===================== */
async function loadSlips(){
  app.innerHTML='<div class="panel"><p class="hint">Đang tải danh sách phiếu…</p></div>';
  try{return await DB.listSlips();}catch(e){app.innerHTML=`<div class="panel"><h2>Không tải được danh sách</h2><p class="hint">${esc(e.code||e.message)}</p></div>`;return null;}
}
const slipRow=s=>`<a class="slipcard" href="#/phieu/${s.id}"><span><b>${esc(s.code)}</b> · ${esc(FORMS[s.type].name)}<br><small>${esc(who(s))} · ${esc(fmtDT(s.createdAt))} · ${s.items.length} dòng</small></span>${badge(s)}</a>`;
async function viewQueue(){
  if(!U)return needLogin('Đăng nhập Google để xem phiếu đang chờ bạn ký.');
  if(!ME.member)return needMember();
  const all=await loadSlips();if(!all)return;
  const mine=all.filter(isMyTurn),waiting=all.filter(s=>s.status==='pending'&&!isMyTurn(s));
  app.innerHTML=`<div class="eyebrow">Cấp duyệt: ${esc(ME.roles.map(r=>ROLES[r]).join(', ')||'chưa gán vai trò')}</div><h2 style="margin:4px 0 0;font-size:26px;color:var(--navy)">Phiếu chờ tôi ký (${mine.length})</h2>
   ${!(ME.profile&&ME.profile.signature)?'<div class="warnbox" style="margin-top:12px"><b style="color:var(--bad)">Bạn chưa khai báo chữ ký.</b> <a href="#/ho-so">Khai báo chữ ký ngay</a> để có thể ký.</div>':''}
   <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">${mine.map(slipRow).join('')||'<p class="hint">Hiện không có phiếu nào đến lượt bạn.</p>'}</div>
   ${waiting.length?`<section class="sec"><h2 style="font-size:19px">Phiếu đang chờ cấp khác (${waiting.length})</h2><div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">${waiting.slice(0,30).map(slipRow).join('')}</div></section>`:''}`;
}
async function viewAll(){
  if(!U)return needLogin('Đăng nhập Google để xem toàn bộ phiếu.');
  if(!ME.member)return needMember();
  const all=await loadSlips();if(!all)return;
  let fs='',fq='';
  const draw=()=>{const l=all.filter(s=>(!fs||s.status===fs)&&(!fq||(s.code+' '+who(s)+' '+(s.head.hang_muc||'')+' '+(s.head.so||'')).toLowerCase().includes(fq.toLowerCase())));
    $('rows').innerHTML=l.map(s=>`<tr><td><a href="#/phieu/${s.id}">${esc(s.code)}</a></td><td>${esc(FORMS[s.type].name)}</td><td>${esc(who(s))}</td><td>${esc(fmtD(s.head.ngay))}</td><td>${s.items.length}</td><td>${badge(s)}</td></tr>`).join('')||'<tr><td colspan="6" class="hint">Không có phiếu.</td></tr>';
    $('cnt').textContent=l.length+' phiếu';$('bx').onclick=()=>exportXlsx(l);};
  app.innerHTML=`<div class="eyebrow">Toàn bộ phiếu</div><h2 style="margin:4px 0 12px;font-size:26px;color:var(--navy)">Tất cả phiếu</h2>
   <div class="row"><input id="fq" placeholder="Tìm mã phiếu, đội, hạng mục" style="max-width:280px" aria-label="Tìm phiếu"><select id="fs" style="max-width:190px" aria-label="Lọc trạng thái"><option value="">Mọi trạng thái</option><option value="pending">Đang chờ ký</option><option value="done">Đã hoàn tất</option><option value="rejected">Bị từ chối</option></select><span id="cnt" class="hint"></span><button class="btn blue sm" id="bx" style="margin-left:auto">Xuất Excel tổng hợp</button></div>
   <div class="panel scroll" style="margin-top:12px"><table class="t"><thead><tr><th>Mã phiếu</th><th>Loại</th><th>Đội / Đơn vị</th><th>Ngày</th><th>Dòng</th><th>Trạng thái</th></tr></thead><tbody id="rows"></tbody></table></div>`;
  $('fq').oninput=e=>{fq=e.target.value;draw();};$('fs').onchange=e=>{fs=e.target.value;draw();};draw();
}

/* ===================== Khai báo chữ ký ===================== */
function viewProfile(){
  if(!U)return needLogin('Đăng nhập Google để khai báo chữ ký.');
  if(!ME.member)return needMember();
  const sig=ME.profile&&ME.profile.signature;
  app.innerHTML=`<div class="eyebrow">Hồ sơ cấp duyệt</div><h2 style="margin:4px 0 0;font-size:26px;color:var(--navy)">Chữ ký của tôi</h2>
   <section class="panel"><h2>Thông tin</h2><p class="hint" style="color:var(--ink);margin:0"><b>${esc(ME.name)}</b> · ${esc(U.email)}<br>Vai trò: ${esc(ME.roles.map(r=>ROLES[r]).join(', ')||'chưa được gán, liên hệ quản trị')}</p>
    <label class="f" for="pname">Họ tên hiển thị trên phiếu<input id="pname" value="${esc(ME.name)}"></label></section>
   <section class="panel"><h2>${sig?'Chữ ký đã khai báo':'Chưa có chữ ký'}</h2>${sig?`<div class="sigprev"><img src="${sig}" alt="Chữ ký hiện tại"></div>`:'<p class="hint">Vẽ chữ ký một lần. Các lần sau bạn chỉ cần bấm Ký.</p>'}
    <h2 style="font-size:15px">${sig?'Ký lại để thay chữ ký':'Ký tên vào khung'}</h2><div id="padHost"></div>
    <div class="row"><button class="btn red" id="save">Lưu chữ ký</button><span id="msg" class="msg" hidden></span></div></section>`;
  const pad=sigPad($('padHost'));
  const setMsg=(t,k)=>{$('msg').hidden=!t;$('msg').textContent=t||'';$('msg').className='msg '+(k||'');};
  $('save').onclick=async()=>{
    const name=$('pname').value.trim();if(!name){setMsg('Nhập họ tên hiển thị.','err');return;}
    if(pad.empty()&&!sig){setMsg('Chưa có chữ ký, hãy ký trong khung.','err');return;}
    $('save').disabled=true;
    try{
      const data=pad.empty()?sig:pad.data();
      await DB.saveProfile(U.uid,{signature:data,name,email:U.email,updatedAt:new Date().toISOString()});
      if(name!==ME.name&&ME.allowed){try{await DB.setAllowed(U.email,{...ME.allowed,name});}catch(e){}}
      ME.profile={...(ME.profile||{}),signature:data,name};ME.name=name;renderChrome();toast('Đã lưu chữ ký.');viewProfile();
    }catch(e){setMsg('Không lưu được: '+(e.code||e.message),'err');$('save').disabled=false;}
  };
}

/* ===================== Quản trị ===================== */
async function viewAdmin(){
  if(!U)return needLogin('Đăng nhập bằng tài khoản quản trị.');
  if(!ME.isAdmin){app.innerHTML='<div class="panel"><h2>Chỉ dành cho quản trị</h2></div>';return;}
  app.innerHTML='<div class="panel"><p class="hint">Đang tải danh sách…</p></div>';
  let list;try{list=await DB.listAllowed();}catch(e){app.innerHTML=`<div class="panel"><h2>Không tải được</h2><p class="hint">${esc(e.code||e.message)}</p></div>`;return;}
  const roleBox=(e,roles)=>`<div class="roles">${ALL_ROLES.map(r=>`<label><input type="checkbox" data-e="${esc(e)}" data-r="${r}" ${roles.includes(r)?'checked':''}>${esc(ROLES[r])}</label>`).join('')}</div>`;
  app.innerHTML=`<div class="eyebrow">Quản trị</div><h2 style="margin:4px 0 0;font-size:26px;color:var(--navy)">Cấp duyệt được phép ký</h2>
   <section class="panel"><h2>Thêm người ký</h2><div class="grid"><label class="f">Email Google<input id="ne" type="email" placeholder="ten@gmail.com" autocomplete="off"></label><label class="f">Họ tên<input id="nn" placeholder="Nguyễn Văn A"></label></div>${roleBox('__new',[])}<div class="row"><button class="btn blue" id="add">Thêm</button><span id="msg" class="msg" hidden></span></div></section>
   <section class="panel"><h2>Danh sách (${list.length})</h2>${list.map(a=>`<div class="card" style="padding:14px"><div class="row" style="justify-content:space-between"><div><b>${esc(a.name||'')}</b><br><small class="hint">${esc(a.email)}${a.admin?' · quản trị':''}</small></div>${a.email===ADMIN?'':`<button class="btn sm" data-del="${esc(a.email)}">Xoá</button>`}</div>${roleBox(a.email,a.roles||[])}</div>`).join('')}</section>`;
  const setMsg=(t,k)=>{$('msg').hidden=!t;$('msg').textContent=t||'';$('msg').className='msg '+(k||'');};
  $('add').onclick=async()=>{
    const e=$('ne').value.trim().toLowerCase(),n=$('nn').value.trim(),roles=[...app.querySelectorAll('[data-e="__new"]:checked')].map(x=>x.dataset.r);
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){setMsg('Email chưa đúng.','err');return;}
    if(!n){setMsg('Nhập họ tên.','err');return;}if(!roles.length){setMsg('Chọn ít nhất một vai trò.','err');return;}
    try{await DB.setAllowed(e,{name:n,roles});toast('Đã thêm '+e);viewAdmin();}catch(x){setMsg('Không thêm được: '+(x.code||x.message),'err');}
  };
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(await modal(`<h3>Xoá quyền ký</h3><p>Xoá <b>${esc(b.dataset.del)}</b> khỏi danh sách cấp duyệt?</p><div class="row"><button class="btn red" data-m="y">Xoá</button><button class="btn" data-m="n">Huỷ</button></div>`)==='y'){try{await DB.delAllowed(b.dataset.del);viewAdmin();}catch(x){toast('Không xoá được: '+(x.code||x.message));}}});
  app.querySelectorAll('input[data-e]:not([data-e="__new"])').forEach(c=>c.onchange=async()=>{
    const e=c.dataset.e,a=list.find(x=>x.email===e),roles=[...app.querySelectorAll(`input[data-e="${CSS.escape(e)}"]:checked`)].map(x=>x.dataset.r);
    try{const {email,...rest}=a;await DB.setAllowed(e,{...rest,roles});a.roles=roles;toast('Đã cập nhật vai trò');if(e===U.email){ME.roles=roles;}}catch(x){toast('Không cập nhật được: '+(x.code||x.message));c.checked=!c.checked;}
  });
}

/* ===================== Định tuyến ===================== */
function route(){
  if(unwatch){try{unwatch();}catch(e){}unwatch=null;}
  const parts=location.hash.replace(/^#\/?/,'').split('/');
  const p=parts[0]||'';
  renderChrome();window.scrollTo(0,0);
  if(p==='')return viewHome();
  if(p==='tao')return viewCreate();
  if(p==='phieu'&&parts[1])return viewSlip(parts[1]);
  if(p==='duyet')return viewQueue();
  if(p==='tatca')return viewAll();
  if(p==='ho-so')return viewProfile();
  if(p==='quan-tri')return viewAdmin();
  viewHome();
}
window.addEventListener('hashchange',route);

/* ===================== Trình duyệt trong Zalo ===================== */
(function(){
  const ua=navigator.userAgent||'';
  if(!/Zalo|FBAN|FBAV|Messenger|Line\/|Instagram|MicroMessenger/i.test(ua))return;
  const isAndroid=/Android/i.test(ua),isIOS=/iPhone|iPad|iPod/i.test(ua);
  $('inapp').hidden=false;
  $('inappText').textContent=isAndroid?'Zalo chặn tải file và đăng nhập Google. Bấm nút "Mở bằng Chrome" bên dưới.':isIOS?'Zalo chặn tải file và đăng nhập Google. Bấm dấu ··· (hoặc biểu tượng chia sẻ) ở góc màn hình, chọn "Mở bằng Safari". Hoặc bấm "Sao chép liên kết", mở Safari rồi dán vào.':'Zalo chặn tải file và đăng nhập Google. Mở liên kết này bằng Chrome hoặc Edge.';
  const intent=()=>{const sch=location.protocol.slice(0,-1);location.href='intent://'+location.host+location.pathname+location.search+location.hash+'#Intent;scheme='+sch+';package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(location.href)+';end';};
  if(isAndroid){$('openChrome').hidden=false;$('openChrome').onclick=intent;let done=false;try{done=sessionStorage.getItem('triedChrome');sessionStorage.setItem('triedChrome','1');}catch(e){}if(!done)setTimeout(intent,400);}
  $('copyLink').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);}catch(e){const t=document.createElement('textarea');t.value=location.href;document.body.appendChild(t);t.select();try{document.execCommand('copy');}catch(_){}t.remove();}$('copyMsg').textContent='Đã sao chép. Mở Chrome hoặc Safari và dán vào thanh địa chỉ.';};
})();

/* ===================== Khởi động ===================== */
(async function boot(){
  renderChrome();
  try{
    if(MOCK)DB=initMock();
    else if(FB_CONFIG)DB=await initFirebase();
    else{app.innerHTML='<div class="panel"><h2>Chưa cấu hình Firebase</h2><p class="hint">Trang chưa được nối với dự án Firebase.</p></div>';return;}
  }catch(e){app.innerHTML=`<div class="panel"><h2>Không kết nối được Firebase</h2><p class="hint">${esc(e.message||e)}. Kiểm tra mạng rồi tải lại trang.</p></div>`;return;}
  let first=true;
  DB.onAuth(u=>{if(first){first=false;}onAuth(u);});
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!MOCK)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
