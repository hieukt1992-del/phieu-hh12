<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2545">
<title>Phiếu điện tử HH12 | Ký online</title>
<meta name="description" content="Lập phiếu xuất kho và phiếu mang ra khỏi công trường HH12 Cổ Loa, ký online nhiều cấp, xuất PDF và Excel.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Phiếu HH12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{color-scheme:light;--navy:#0b2545;--blue:#245cad;--blue2:#e8f0fb;--red:#e5322d;--red2:#ff5a4f;--ink:#0f1b2d;--muted:#5b6b85;--line:#d8e1ee;--bg:#f6f9fd;--card:#fff;--ok:#1d7a4a;--warn:#b7791f;--bad:#b3261e}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Be Vietnam Pro",system-ui,sans-serif;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
a{color:var(--blue)}
.hd{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.hd .in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.logo i{font-style:normal;flex:none;width:40px;height:40px;border-radius:10px;background:var(--blue);color:#fff;font-weight:800;display:grid;place-items:center;font-size:15px}
.logo b{display:block;font-size:15px;line-height:1.2}
.logo span{display:block;font-size:11.5px;color:var(--muted);line-height:1.2}
.nav{display:flex;gap:6px;flex-wrap:wrap;flex:1;justify-content:center}
.nav a{padding:8px 14px;border-radius:999px;background:#9db6dd;color:#fff;font-weight:700;font-size:12.5px;text-decoration:none;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap}
.nav a.on{background:var(--blue)}
.who{display:flex;gap:8px;align-items:center;margin-left:auto}
.who small{color:var(--muted);font-size:12px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{font:inherit;font-weight:700;font-size:14px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.red{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(229,50,45,.28)}
.btn.blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.btn.line{background:#fff;color:var(--blue);border-color:var(--blue)}
.btn:disabled{opacity:.55;cursor:wait}
:focus-visible{outline:3px solid #2a6fdb;outline-offset:2px}
main{max-width:1080px;margin:0 auto;padding:22px 16px 60px}
.hero{text-align:center;padding:34px 18px 18px;border-radius:18px;color:#fff;background:linear-gradient(rgba(8,26,54,.62),rgba(8,26,54,.78)),#0b2545 url(hh12.jpg) center/cover no-repeat}
.hero .stats span{color:#dbe6f7}
.hero .stats b{color:#ff7a7a}
tr.grp td{background:#dce6f5;padding:8px 12px}
.avatar{width:150px;height:150px;border-radius:50%;margin:0 auto 14px;border:4px solid var(--blue);background:linear-gradient(160deg,#0b2545,#245cad);display:grid;place-items:center;color:#fff;font-weight:800;font-size:44px;letter-spacing:1px;box-shadow:0 10px 30px rgba(36,92,173,.25)}
.tag{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--blue);color:var(--blue);border-radius:999px;padding:4px 14px;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;background:#fff}
.tag:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red)}
.hero h1{margin:12px 0 6px;font-size:34px;line-height:1.15;color:#fff;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.hero p{max-width:640px;margin:0 auto;color:#e8eefb}
.stats{display:flex;justify-content:center;gap:34px;margin:22px 0;flex-wrap:wrap}
.stats div{text-align:center}
.stats b{display:block;font-size:34px;color:var(--red);font-weight:800;line-height:1.1}
.stats span{font-size:11.5px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.sec{margin-top:42px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--red)}
.sec h2{margin:4px 0 6px;font-size:26px;color:var(--navy)}
.sec>p{margin:0 0 18px;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card .n{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:16px;color:var(--navy)}
.card p{margin:0;color:var(--muted);font-size:14px}
.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.chain span{background:var(--blue2);color:var(--navy);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px}
.chain span.a{background:#e9f4e7;color:#2f5d2a}
.chain span.g{background:#fdeceb;color:#8a1c17}
.chain i{font-style:normal;color:var(--muted)}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;margin-top:16px}
.panel h2{margin:0;font-size:17px;color:var(--navy);display:flex;align-items:center;gap:10px}
.panel h2 i{font-style:normal;background:var(--blue);color:#fff;border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-size:13px;padding:0 8px}
.tabs{display:flex;gap:10px;flex-wrap:wrap}
.tabs button{flex:1 1 260px;text-align:left;padding:12px 14px;min-height:60px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;font:inherit;cursor:pointer}
.tabs button b{display:block;font-size:14.5px}
.tabs button span{font-size:12.5px;color:var(--muted)}
.tabs button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue2);box-shadow:inset 0 0 0 1px var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
input,select,textarea{font:inherit;font-size:15px;min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:0 12px;width:100%;min-width:0}
textarea{padding:10px 12px;min-height:80px}
.invalid{border-color:var(--bad)!important;box-shadow:0 0 0 2px var(--bad)}
.rowcard{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;background:var(--bg)}
.rowcard .name{grid-column:1/-1}
.rowcard .h{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{color:var(--muted);font-size:13px;margin:0}
.msg{padding:10px 12px;border-radius:10px;font-size:13.5px;background:var(--blue2)}
.msg.err{background:#fdeceb;color:var(--bad)}.msg.ok{background:#e6f5ec;color:var(--ok)}
h3.g{margin:6px 0 0;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.item{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 8px 0 0;min-height:52px}
.item.on{border-color:var(--blue);background:var(--blue2);box-shadow:inset 0 0 0 1px var(--blue)}
.item .pick{flex:1;display:flex;align-items:center;gap:10px;padding:6px 8px 6px 12px;cursor:pointer;min-width:0;min-height:50px}
.item .pick input{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--blue)}
.item .code{font:700 13px ui-monospace,Menlo,monospace;min-width:64px;flex:none}
.item .nm{flex:1;min-width:0;font-size:14.5px}
.item .u{color:var(--muted);font-size:12.5px;flex:none}
.item .qty{width:84px;flex:none;text-align:right;min-height:40px;font-weight:700}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:8px}
@media (max-width:480px){.list{grid-template-columns:1fr}.item .pick{gap:8px;padding-left:10px}.item .code{min-width:0;font-size:12px}.item .nm{font-size:14px}.item .qty{width:66px}.item .u{font-size:11.5px}.hero h1{font-size:27px}.nav{justify-content:flex-start}}
.pad{border:2px dashed var(--blue);border-radius:12px;background:#fff;touch-action:none;width:100%;height:200px;display:block;cursor:crosshair}
.sigprev{border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px;max-width:340px}
.sigprev img{max-width:100%;max-height:120px;display:block;margin:auto}
.pvbox{overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#8b96a8}
.pvin{transform-origin:top left;width:794px;margin:0 auto}
.pvin .sheet{margin:0 0 16px}
.badge{display:inline-block;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700}
.b-pending{background:#fff4dd;color:var(--warn)}.b-done{background:#e6f5ec;color:var(--ok)}.b-rejected{background:#fdeceb;color:var(--bad)}
.tl{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:30px 1fr;gap:10px;padding-bottom:14px;position:relative}
.tl li:before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child:before{display:none}
.tl .d{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--line);color:var(--muted)}
.tl li.done .d{background:var(--ok);color:#fff}.tl li.cur .d{background:var(--red);color:#fff}.tl li.rej .d{background:var(--bad);color:#fff}
.tl b{display:block;font-size:14px}.tl small{color:var(--muted)}
.tl img{max-height:46px;max-width:160px;display:block;margin-top:4px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
table.t th{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.scroll{overflow-x:auto}
.slipcard{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;text-decoration:none;color:inherit}
.slipcard b{color:var(--navy)}
.roles{display:flex;gap:10px;flex-wrap:wrap}
.roles label{display:flex;gap:6px;align-items:center;font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:#fff}
.roles input{width:18px;height:18px;min-height:0}
.modal{position:fixed;inset:0;background:rgba(11,37,69,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal>div{background:#fff;border-radius:16px;padding:20px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.modal h3{margin:0;color:var(--navy)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;max-width:92vw}
.warnbox{border:1.5px solid var(--bad);background:#fff;border-radius:12px;padding:14px}
footer{max-width:1080px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:12.5px;text-align:center}
/* ---- Newtecons style ---- */
:root{--navy:#071b36;--blue:#1d5292;--blue2:#eaf1fa;--red:#ed1c24;--red2:#ed1c24;--line:#dbe4f0;--bg:#f3f5f9}
body{background:var(--bg)}
.hd{background:linear-gradient(90deg,#071b36,#0b2545);border-bottom:0;box-shadow:0 2px 12px rgba(7,27,54,.25)}
.hd .in{padding:8px 16px;gap:18px;flex-wrap:nowrap}
.logo{color:#fff;gap:10px}
.logo i{width:34px;height:34px;border-radius:4px;background:#1d5292;font-size:18px;letter-spacing:0}
.logo b{font-size:14px;letter-spacing:3px;font-weight:800}
.logo>span,.logo b{display:block;color:#fff}
.nav{justify-content:flex-start;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{background:transparent;color:#b9cde6;border-radius:0;padding:12px 12px;font-size:12px;font-weight:600;letter-spacing:.8px;border-bottom:2px solid transparent}
.nav a:hover{color:#fff}
.nav a.on{background:transparent;color:#fff;border-bottom-color:#4e97d9}
.who small{color:#b9cde6}
.who .btn{background:transparent;color:#fff;border-color:#3e6c9e;min-height:34px}
.who .btn.blue{background:#1d5292;border-color:#1d5292}
.btn{border-radius:4px}
.btn.red{background:#1d5292;box-shadow:none;border-color:#1d5292}
.btn.line{color:#1d5292;border-color:#1d5292}
main{padding:20px 16px 50px}
.hero{text-align:left;padding:44px 28px;border-radius:6px;background:linear-gradient(105deg,rgba(7,27,54,.94) 30%,rgba(7,27,54,.55)),#071b36 url(hh12.jpg) center/cover no-repeat}
.hero .ey{font-size:11.5px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#4e97d9}
.hero h1{margin:8px 0 6px;font-size:36px;font-weight:300;text-shadow:none}
.hero h1 b{font-weight:800}
.hero p{margin:0 0 22px;color:#b9cde6;max-width:520px}
.cta{justify-content:flex-start}
.hero .btn.red{background:#4e97d9;border-color:#4e97d9;color:#071b36}
.hero .btn.line{background:transparent;color:#fff;border-color:#3e6c9e}
.eyebrow{color:#4e97d9;letter-spacing:3px;font-size:11.5px}
.sec{margin-top:30px}.sec h2{font-size:22px;font-weight:300;color:#071b36}.sec h2 b{font-weight:800}
.card,.panel,.slipcard{border-radius:6px;border-color:var(--line);box-shadow:0 1px 3px rgba(7,27,54,.06)}
.panel{padding:16px 18px;margin-top:12px}
.panel h2{font-size:15px;letter-spacing:.3px;text-transform:uppercase;color:#071b36}
.panel h2 i{border-radius:3px;background:#071b36;min-width:24px;height:24px}
.ttl{margin:2px 0 0;font-size:26px;font-weight:300;color:#071b36}.ttl b{font-weight:800}
.tabs button{border-radius:6px;min-height:52px}
.tabs button[aria-pressed="true"]{border-color:#1d5292;background:#eaf1fa;box-shadow:inset 3px 0 0 #1d5292}
.tabs button span{display:none}
input,select,textarea,.item,.rowcard{border-radius:4px}
.pad{border-color:#1d5292;border-radius:4px}
footer{padding:0 16px 28px;font-size:11.5px;letter-spacing:.3px}
@media(max-width:640px){.hd .in{flex-wrap:wrap;gap:6px}.logo{flex:1 1 0}.who{flex:none}.nav{order:3;flex:1 0 100%}.hero{padding:30px 18px}.hero h1{font-size:28px}.logo b{font-size:11.5px;letter-spacing:1.5px}.who .btn{padding:0 10px;font-size:12px}.who small{max-width:90px}}
/* ---- Tờ giấy (xem trước và PDF) ---- */
.sheet{width:794px;height:1123px;background:#fff;color:#000;padding:38px 50px;font:13.5px/1.35 "Times New Roman",Times,serif;position:relative;overflow:hidden}
.sheet *{box-sizing:border-box}
.hdp{display:grid;grid-template-columns:190px 1fr;border:1px solid #000}
.hdp .logo2{grid-row:1/5;border-right:1px solid #000;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif}
.hdp .logo2 b{font-size:20px;letter-spacing:.5px;color:#0b2545}
.hdp .logo2 i{font-size:9px;font-style:normal;color:#0b2545;margin-top:2px}
.hdp .c{padding:3px 8px;border-bottom:1px solid #000;font-size:12.5px;min-height:24px}
.hdp .c:last-child{border-bottom:0}
.hdp .t{text-align:center;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;padding:8px;line-height:1.35}
.line2{display:flex;gap:8px;align-items:baseline;margin-top:10px}
.line2 .v{flex:1;border-bottom:1px dotted #000;min-height:18px;padding-left:4px}
.tb{width:100%;border-collapse:collapse;margin-top:10px;table-layout:fixed}
.tb th,.tb td{border:1px solid #000;padding:3px 5px;font-size:12.5px;vertical-align:middle;word-break:break-word}
.tb th{font-weight:700;text-align:center;height:34px}
.tb td{height:30px}
.tb td.c{text-align:center}
.sig{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid #000}
.sig>div{border-right:1px solid #000;padding:4px 6px;text-align:center;font-weight:700;font-size:12.5px}
.sig>div:last-child{border-right:0}
.sigbox{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid #000;border-top:0}
.sigbox>div{border-right:1px solid #000;padding:4px 4px 6px;font-size:11px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center}
.sigbox>div:last-child{border-right:0}
.sigbox .sg{max-width:100%;max-height:76px;object-fit:contain;margin-bottom:3px}
.sigbox .sn{font-size:11.5px;font-weight:700}
.sigbox .st{font-size:8.5px;color:#444}
.pg{position:absolute;right:50px;bottom:14px;font-size:11px;color:#444}
.vf{position:absolute;left:50px;bottom:14px;font-size:9.5px;color:#0b2545;font-family:Arial,sans-serif}

/* ===== Biên bản phạt NTP-ĐTC ===== */
.bb-fixed{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.bb-person{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--blue2)}
.bb-person b{display:block;font-size:14.5px;color:var(--navy)}.bb-person span{font-size:12.5px;color:var(--muted)}
.bb-vio{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:#f7f9fc}
.bb-chips{display:flex;gap:6px;flex-wrap:wrap}
.bb-chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap;background:#fff;border:1px solid var(--line)}
.bb-chip.l1{background:#e6f5ec;color:#1d7a4a;border-color:transparent}.bb-chip.l2{background:#fdebc8;color:#9a5b00;border-color:transparent}.bb-chip.l3{background:#fde2e1;color:#b3261e;border-color:transparent}
.bb-seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bb-seg button{flex:1;border:0;min-height:40px;font:inherit;font-size:13px;font-weight:700;background:#fff;color:var(--ink);cursor:pointer}
.bb-seg button+button{border-left:1px solid var(--line)}.bb-seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.bb-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.bb-sum div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}.bb-sum span{display:block;font-size:12px;color:var(--muted)}.bb-sum b{font-size:18px;font-variant-numeric:tabular-nums}
pre.bb-gen{margin:0;white-space:pre-wrap;font:14px/1.55 "Times New Roman",Times,serif;background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:340px;overflow:auto}
.bb-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bb-thumbs figure{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#f7f9fc;display:flex;flex-direction:column}
.bb-thumbs img{width:100%;height:120px;object-fit:cover;display:block}.bb-thumbs figcaption{padding:6px;display:flex;flex-direction:column;gap:6px}

function sigPad(host){
  host.innerHTML='<canvas class="pad" aria-label="Khung ký tên"></canvas><div class="row" style="margin-top:8px"><button type="button" class="btn sm" data-clear>Xoá, ký lại</button><span class="hint">Dùng ngón tay hoặc chuột ký trong khung.</span></div>';
  const cv=host.querySelector('canvas'),ctx=cv.getContext('2d');
  let drawing=false,dirty=false,last=null,bb=null;
  const fit=()=>{const r=cv.getBoundingClientRect(),k=window.devicePixelRatio||1;cv.width=Math.max(1,Math.round(r.width*k));cv.height=Math.max(1,Math.round(r.height*k));ctx.setTransform(k,0,0,k,0,0);ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#0b1f5c';};
  requestAnimationFrame(fit);
  const pt=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
  const grow=p=>{bb=bb?[Math.min(bb[0],p[0]),Math.min(bb[1],p[1]),Math.max(bb[2],p[0]),Math.max(bb[3],p[1])]:[p[0],p[1],p[0],p[1]];};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();if(cv.width<=1)fit();cv.setPointerCapture(e.pointerId);drawing=true;last=pt(e);grow(last);ctx.beginPath();ctx.arc(last[0],last[1],1.2,0,7);ctx.fillStyle='#0b1f5c';ctx.fill();dirty=true;});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=pt(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();grow(p);last=p;});
  const up=()=>{drawing=false;};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  host.querySelector('[data-clear]').onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);dirty=false;bb=null;};
  return {empty:()=>!dirty||!bb||(bb[2]-bb[0]<12&&bb[3]-bb[1]<12),data:()=>{
    const k=window.devicePixelRatio||1,pd=6;
    const x=Math.max(0,(bb[0]-pd)*k),y=Math.max(0,(bb[1]-pd)*k),w=Math.min(cv.width-x,(bb[2]-bb[0]+2*pd)*k),h=Math.min(cv.height-y,(bb[3]-bb[1]+2*pd)*k);
    const s=Math.min(1,380/w),o=document.createElement('canvas');o.width=Math.max(1,Math.round(w*s));o.height=Math.max(1,Math.round(h*s));
    o.getContext('2d').drawImage(cv,x,y,w,h,0,0,o.width,o.height);return o.toDataURL('image/png');}};
}

/* ===================== Xuất file ===================== */
async function deliverFile(name,blob,mime,mode){
  const file=new File([blob],name,{type:mime});const url=URL.createObjectURL(blob);
  let canShare=false;try{canShare=!!(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]}));}catch(e){}
  const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const dl=()=>{const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();};
  if(mode==='dl'){dl();toast('Đã tải: '+name+' (thư mục Tải xuống / Downloads)');return;}
  if(mode==='zalo'&&!canShare){dl();toast('Đã tải file. Mở Zalo và gửi file vừa tải (thư mục Tải xuống).');setTimeout(()=>window.open('https://chat.zalo.me/','_blank'),600);return;}
  const p=modal(`<h3>Đã tạo xong file</h3><p class="hint" style="color:var(--ink)">Tên file: <b>${esc(name)}</b><br>${canShare?'Bấm "Gửi / Lưu file" để gửi qua Zalo hoặc lưu vào ứng dụng Tệp (Files). ':''}${mobile?'Nếu bấm "Tải xuống", file nằm trong thư mục Tải xuống (Downloads) của điện thoại, xem trong ứng dụng Tệp / My Files.':'File nằm trong thư mục Tải xuống (Downloads) của máy.'}</p>
   <div class="row">${canShare?'<button class="btn red" id="fShare">Gửi / Lưu file (Zalo, Tệp…)</button>':''}<button class="btn blue" id="fDl">Tải xuống</button>${mime==='application/pdf'?'<button class="btn" id="fOpen">Mở xem</button>':''}<button class="btn" data-m="x">Đóng</button></div>`);
  if($('fShare'))$('fShare').onclick=()=>navigator.share({files:[file],title:name}).catch(()=>{});
  $('fDl').onclick=dl;if($('fOpen'))$('fOpen').onclick=()=>window.open(url,'_blank');
  if(!canShare)dl();
  await p;
}
async function buildPdf(s){
  const F=FORMS[s.type];
  if(typeof html2canvas==='undefined'||!window.jspdf)throw new Error('chưa tải được thư viện tạo PDF, kiểm tra mạng rồi thử lại');
  $('print').innerHTML=sheetsHtml(s.type,s.head,s.items,s.steps,s);
  const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
  const els=[...$('print').querySelectorAll('.sheet')];
  for(let i=0;i<els.length;i++){const cv=await html2canvas(els[i],{scale:2,backgroundColor:'#ffffff',useCORS:true});if(i)pdf.addPage();pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297);}
  const w=who(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
  return {name:[F.file,w,s.code].filter(Boolean).join('_')+'.pdf',blob:pdf.output('blob')};
}
async function exportPdf(s,mode){
  toast('Đang tạo PDF…');
  try{const r=await buildPdf(s);await deliverFile(r.name,r.blob,'application/pdf',mode);}
  catch(e){toast('Không tạo được PDF: '+(e.message||'lỗi'));}
}
/* Gửi PDF về email Google đang đăng nhập (qua Apps Script, chạy bằng Gmail của quản trị) */
const mailedSet=()=>{try{return JSON.parse(localStorage.getItem('mailed')||'[]');}catch(e){return [];}};
const markMailed=id=>{try{const a=mailedSet();if(!a.includes(id))a.push(id);localStorage.setItem('mailed',JSON.stringify(a.slice(-100)));}catch(e){}};
async function sendMail(s){
  if(!MAIL_URL)throw new Error('chưa cấu hình dịch vụ gửi mail');
  if(!U)throw new Error('chưa đăng nhập');
  const tok=await DB.idToken();if(!tok)throw new Error('không lấy được phiên đăng nhập');
  const r=await buildPdf(s);
  const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error('không đọc được PDF'));fr.onload=()=>res(String(fr.result).split(',')[1]);fr.readAsDataURL(r.blob);});
  const resp=await fetch(MAIL_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({idToken:tok,name:r.name,code:s.code,who:who(s),form:FORMS[s.type].name,pdf:b64})});
  const j=await resp.json();if(!j.ok)throw new Error(j.err||'gửi mail thất bại');
  markMailed(s.id);return j.to||U.email;
}
async function autoMail(){
  if(!MAIL_URL||!U)return;
  const done=mailedSet();const todo=mySlips().filter(x=>!done.includes(x.id)).slice(0,5);
  for(const x of todo){
    try{const s=await DB.getSlip(x.id);if(!s){markMailed(x.id);continue;}if(s.status!=='done')continue;
      const to=await sendMail(s);toast('Đã gửi PDF phiếu '+s.code+' về '+to);}
    catch(e){console.warn('autoMail',e);}
  }
}

  const codeOf=i=>{const m=String(i.ma||'').trim();if(CAT.some(c=>c[0]===m))return m;const p=String(i.ten||'').match(/\(([A-Z0-9-]+)\)\s*$/);if(p&&CAT.some(c=>c[0]===p[1]))return p[1];const t=CAT.find(c=>c[1].toLowerCase()===String(i.ten||'').trim().toLowerCase());return t?t[0]:'';};
  const GOLD='FFC9A24B',LIGHT='FFEAF0FA';
  const title=(ws,t,n)=>{ws.addRow([t]);ws.mergeCells(1,1,1,n);ws.getCell('A1').font={bold:true,size:13,name:'Times New Roman',color:{argb:NAVY}};ws.addRow(['Ngày xuất báo cáo: '+fmtD(today())+' · chỉ tính phiếu đã ký đủ']);ws.mergeCells(2,1,2,n);ws.getCell('A2').font={italic:true,name:'Times New Roman'};};

  const cell=(ws,r,c,v,o)=>{const x=ws.getCell(r,c);if(v!==undefined)x.value=v;x.border=BORD;x.alignment={vertical:'middle',wrapText:true,horizontal:(o&&o.left)?'left':'center'};x.font={name:'Times New Roman',bold:!!(o&&o.bold)};if(o&&o.fill)x.fill={type:'pattern',pattern:'solid',fgColor:{argb:o.fill}};return x;};
  const GFILL='FFDCE6F5';

  const writeAgg=(ws,start,rows,nv,fc)=>{

  app.innerHTML=`<a href="#/" class="hint">← Trang chủ</a>
   <div class="row" style="justify-content:space-between;margin-top:6px"><div><div class="eyebrow">${esc(F.name)}</div><h2 style="margin:2px 0 0;font-size:24px;color:var(--navy)">${esc(s.code)}</h2><span class="hint">${esc(who(s))} · lập lúc ${esc(fmtDT(s.createdAt))}</span></div>${badge(s)}</div>

const zaloPhone=p=>{const d=String(p||'').replace(/\D/g,'');return d.startsWith('84')?d:d.replace(/^0/,'84');};

const zaloApMsg=s=>`Phiếu ${s.code} (${FORMS[s.type].name}) của ${who(s)} đã ký, chờ GS. Phụ trách duyệt.\nMở link để ký duyệt: ${slipLink(s.id)}`;
async function zaloApprover(s){

async function doSign(s){
  const sig=ME.profile&&ME.profile.signature;
  if(!sig){toast('Bạn chưa khai báo chữ ký.');location.hash='#/ho-so';return;}
  const p=modal(`<h3>Xác nhận ký</h3><p class="hint" style="color:var(--ink)">Bạn ký với vai trò <b>${esc(cur(s).label)}</b> cho phiếu <b>${esc(s.code)}</b> bằng chữ ký đã khai báo:</p><div class="sigprev"><img src="${sig}" alt="Chữ ký của bạn"></div>
   <label class="row" style="gap:8px"><input type="checkbox" id="chk" style="width:20px;height:20px;min-height:0"> Tôi đã kiểm tra nội dung phiếu</label><div class="row"><button class="btn ok" data-m="yes" id="yes" disabled>Ký</button><button class="btn" data-m="no">Huỷ</button></div>`);
  $('chk').onchange=e=>{$('yes').disabled=!e.target.checked;};
  if(await p!=='yes')return;
  try{
    const now=new Date().toISOString();
    let steps=s.steps.map((x,i)=>i===s.currentStep?{...x,name:ME.name,email:U.email,sig,at:now}:x);
    const missing=[];
    const pendingManual=steps.some((x,i)=>i>0&&!x.sig&&!x.mode);
    if(!pendingManual){
      const need=steps.map((x,i)=>x.mode==='auto'&&!x.sig?i:-1).filter(i=>i>=0);
      for(const i of need){const st=await DB.getStamp(steps[i].role);
        if(!st||!st.sig){missing.push(steps[i].label);continue;}
        steps[i]={...steps[i],name:st.name||'',sig:st.sig,at:now};}
    }
    const nextManual=steps.findIndex((x,i)=>i>0&&!x.sig&&!x.mode);
    const finished=nextManual<0;
    await DB.updateSlip(s.id,{steps,currentStep:finished?steps.length:nextManual,status:finished?'done':'pending'});
    remember({id:s.id,code:s.code,doi:s.head.doi||s.head.don_vi||'',at:now});
    toast(finished?(missing.length?'Đã ký xong. Chưa có chữ ký mẫu của '+missing.join(', ')+' nên để trống (tải lên ở Quản trị).':'Đã ký xong, phiếu hoàn tất. Xuất PDF gửi Zalo cho giám sát in.'):'Đã ký, chuyển cấp tiếp theo.');
    if(finished&&s.head.sdt){const pz=modal(`<h3>Đã duyệt xong</h3><p class="hint" style="color:var(--ink)">Gửi link phiếu <b>${esc(s.code)}</b> cho người đề nghị qua Zalo số <b>${esc(s.head.sdt)}</b>. Bấm nút dưới: tin nhắn được sao chép sẵn và Zalo mở đúng số này, bạn chỉ cần dán và gửi.</p><div class="row"><button class="btn red" id="zSend">Gửi Zalo cho ${esc(s.head.sdt)}</button><button class="btn" data-m="x">Để sau</button></div>`);$('zSend').onclick=()=>openZalo(s);await pz;}
  }catch(e){toast('Không ký được: '+(e.code||e.message));}
}
async function delSlip(s,after){
  const r=await modal(`<h3>Xoá phiếu ${esc(s.code)}?</h3><p class="hint" style="color:var(--ink)">${esc(FORMS[s.type].name)} · ${esc(who(s))} · ${s.items.length} dòng. Xoá xong không khôi phục được, số liệu thống kê và file Excel sẽ tự cập nhật theo.</p><div class="row"><button class="btn red" data-m="yes">Xoá phiếu</button><button class="btn" data-m="no">Huỷ</button></div>`);
  if(r!=='yes')return;
  try{
    await DB.deleteSlip(s.id);
    const m=new RegExp('^'+PROJECT_CODE.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'_(.+)_(\\d+)$').exec(s.code||'');
    if(m){const slug=m[1],n=parseInt(m[2],10);if(n>0){try{await DB.decSeqIfLatest(slug,n);}catch(e){}}}
    toast('Đã xoá phiếu '+s.code);if(after)after();else location.hash='#/tatca';
  }catch(e){toast('Không xoá được: '+(e.code||e.message));}
}

/* ===================== Thép: đội gửi ảnh → máy chủ tự đọc (≈10 phút) → cán bộ duyệt → Excel ===================== */
function compressImageFile(file,maxW,quality){
  return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error('không đọc được ảnh'));fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('ảnh không hợp lệ'));im.onload=()=>{
    const k=Math.min(1,maxW/im.width),w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k));
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);
    res(cv.toDataURL('image/jpeg',quality));};im.src=fr.result;};fr.readAsDataURL(file);});
}
async function shrinkToLimit(file,limitBytes){
  let w=1600,q=0.75,out=null;
  for(let i=0;i<7;i++){out=await compressImageFile(file,w,q);const bytes=Math.ceil(out.length*0.75);if(bytes<=limitBytes)break;if(q>0.45)q-=0.1;else w=Math.round(w*0.82);}
  return out;
}
// Số kiểu Việt Nam do người gõ: "." phân cách nghìn, "," thập phân. Số đã lưu dạng number thì giữ nguyên (không bóc dấu chấm thập phân).
const steelNum=v=>{if(typeof v==='number')return isFinite(v)?v:0;const n=parseFloat(String(v??'').trim().replace(/\s/g,'').replace(/\./g,'').replace(',','.'));return isNaN(n)?0:n;};
const steelFmt=n=>{const r=Math.round((n||0)*1000)/1000,neg=r<0,abs=Math.abs(r);const[ip,dp]=String(abs).split('.');const ipf=ip.replace(/\B(?=(\d{3})+(?!\d))/g,'.');return (neg?'-':'')+ipf+(dp?','+dp:'');};
// Máy chủ Deno Deploy: giấu API key Gemini + tự đọc hàng đợi ảnh thép 10 phút/lần (Cloudflare Workers bị Google chặn theo vùng nên đã chuyển sang đây)
const OCR_URL='https://tiny-bumblebee-7019.hieukt1992-del.deno.net';
const pingSteel=()=>{try{fetch(OCR_URL+'/process',{method:'POST',mode:'no-cors',keepalive:true}).catch(()=>{});}catch(e){}};
const STEEL_ST={cho_duyet:'Chờ duyệt',da_duyet:'Đã duyệt'};
const steelSt=r=>r.trang_thai||'da_duyet'; // lượt nộp kiểu cũ (đội tự gõ, tự kiểm) coi như đã duyệt
const steelDia=s=>{const m=String(s||'').toUpperCase().match(/(?:^|[^A-Z0-9])(?:D|Ø|Φ|PHI)\s?(\d{1,2})(?!\d)/);return m?+m[1]:0;};
// Kiểm tra logic 1 dòng: khối lượng phải khớp số cây × chiều dài cây (thường 11,7 m) × d²/162
function steelWarn(it){
  const w=[],loai=String(it.loai||'').trim(),d=steelDia(loai),c=steelNum(it.so_cay),kg=steelNum(it.khoi_luong);
  if(!loai)w.push('thiếu loại thép');else if(!d)w.push('không rõ đường kính');
  if(!kg)w.push('thiếu khối lượng');
  const cuon=d<10||/cu[ộo]n|CB240/i.test(loai);
  if(!c&&!cuon)w.push('thiếu số cây');
  if(d&&c&&kg&&!cuon){const L=kg/(c*d*d/162);if(L<5.5||L>12.6)w.push(`KL không khớp số cây: ${steelFmt(c)} cây D${d} ⇒ ${String(L.toFixed(1)).replace('.',',')} m/cây (chuẩn 11,7 m)`);}
  return w;
}
function steelIndex(all){const byHash={},byLot={};all.forEach(r=>{if(r.img_hash)(byHash[r.img_hash]=byHash[r.img_hash]||[]).push(r);
  (r.items||[]).forEach(it=>{const lo=String(it.so_lo||'').trim();if(lo.length<4)return;const k=lo+'|'+steelDia(it.loai)+'|'+steelNum(it.khoi_luong);(byLot[k]=byLot[k]||[]).push(r);});});return {byHash,byLot};}
function steelIssues(r,idx){
  const out=[];(r.items||[]).forEach((it,i)=>steelWarn(it).forEach(w=>out.push('Dòng '+(i+1)+': '+w)));
  const other=a=>(a||[]).find(x=>x.id!==r.id);
  if(r.img_hash){const o=other(idx.byHash[r.img_hash]);if(o)out.push(`Ảnh trùng với lượt ${fmtD(o.ngay)} · ${o.doi} — có thể gửi 2 lần`);}
  const seen=new Set();(r.items||[]).forEach(it=>{const lo=String(it.so_lo||'').trim();if(lo.length<4)return;const k=lo+'|'+steelDia(it.loai)+'|'+steelNum(it.khoi_luong);if(seen.has(k))return;seen.add(k);const o=other(idx.byLot[k]);if(o)out.push(`Số lô ${lo} cùng loại, cùng KL với lượt ${fmtD(o.ngay)} · ${o.doi} — có thể nộp trùng`);});
  const np=r.meta&&String(r.meta.ngay_phieu||'').match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/);
  if(np&&r.ngay){const a=new Date(+np[3],+np[2]-1,+np[1]),b=new Date(r.ngay+'T00:00:00');if(Math.abs(a-b)>3*864e5)out.push(`Ngày trên phiếu (${np[1]}/${np[2]}/${np[3]}) khác ngày nhận khai báo (${fmtD(r.ngay)})`);}
  return out;
}
function steelRowsTable(rows){
  const tr=rows.map((r,i)=>{const w=steelWarn(r);return `<tr${w.length?' style="background:#fff6e0"':''}>
     <td class="c">${i+1}</td>
     <td><input data-f="loai" data-i="${i}" list="steelHints" value="${esc(r.loai)}" placeholder="VD: D20 CB500-V"></td>
     <td><input data-f="so_cay" data-i="${i}" inputmode="numeric" value="${esc(r.so_cay)}" style="text-align:right"></td>
     <td><input data-f="khoi_luong" data-i="${i}" inputmode="decimal" value="${esc(r.khoi_luong)}" style="text-align:right"></td>
     <td><input data-f="so_lo" data-i="${i}" value="${esc(r.so_lo)}"></td>
     <td><input data-f="ghi_chu" data-i="${i}" value="${esc(r.ghi_chu)}"></td>
     <td><button type="button" class="btn sm" data-del="${i}" style="color:var(--bad);border-color:var(--bad)">Xoá</button></td></tr>`;}).join('');
  return `<datalist id="steelHints">${STEEL_HINTS.map(h=>`<option value="${esc(h)}">`).join('')}</datalist>
   <div class="scroll"><table class="t"><thead><tr><th>STT</th><th>Loại thép</th><th>Số cây</th><th>Khối lượng (kg)</th><th>Số lô</th><th>Ghi chú</th><th></th></tr></thead><tbody>${tr}</tbody></table></div>`;
}
async function fileHash(f){try{const h=await crypto.subtle.digest('SHA-256',await f.arrayBuffer());return [...new Uint8Array(h)].slice(0,16).map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){return '';}}

/* ---------- Cán bộ kiểm tra & duyệt (sửa số, xem ảnh gốc) ---------- */
async function steelReview(src,all){
  // src: 1 lượt "chờ duyệt" do máy đọc, hoặc {job} khi máy không đọc được và cần nhập tay

    <div id="rvImg" class="sigprev" style="max-width:none;text-align:center">${imgId||(rec&&rec.scan)?'<span class="hint">Đang tải ảnh…</span>':'<span class="hint">Không có ảnh gốc</span>'}</div>

  const setMsg=(t,k)=>{$('rvMsg').hidden=!t;$('rvMsg').textContent=t||'';$('rvMsg').className='msg '+(k||'');};
  const items=()=>ROWS.filter(r=>String(r.loai).trim()||steelNum(r.so_cay)||steelNum(r.khoi_luong)).map(r=>({loai:String(r.loai).trim(),so_cay:steelNum(r.so_cay),khoi_luong:steelNum(r.khoi_luong),so_lo:String(r.so_lo||'').trim(),ghi_chu:String(r.ghi_chu||'').trim()}));

    $('rvOk').disabled=true;setMsg('Đang lưu…');
    const sum={items:it,tong_cay:it.reduce((a,r)=>a+r.so_cay,0),tong_kg:it.reduce((a,r)=>a+r.khoi_luong,0),doi,ngay,trang_thai:'da_duyet',duyet_boi:ME.name||(U&&U.email)||'',duyet_luc:Date.now()};
    try{
      if(rec)await DB.updateSteelReceipt(rec.id,sum);
      else await DB.createSteelReceipt({...sum,nguoi_nop:job.nguoi_nop||'',ghi_chu:job.ghi_chu||'',nguon:'tay',img_hash:job.hash||''});
      if(imgId)await DB.deleteSteelJob(imgId).catch(()=>{}); // duyệt xong thì xoá ảnh, chỉ giữ số liệu
      toast('Đã duyệt, tổng hợp cập nhật ngay.');$('modal').__done&&$('modal').__done('ok');
    }catch(e){setMsg('Không lưu được: '+(e.code||e.message),'err');$('rvOk').disabled=false;}
  };
  $('rvDel').onclick=async()=>{
    if(!confirm(rec?'Xoá lượt nhận này (cả ảnh gốc)?':'Xoá ảnh này khỏi hàng chờ?'))return;
    try{if(rec)await DB.deleteSteelReceipt(rec.id);if(imgId)await DB.deleteSteelJob(imgId).catch(()=>{});toast('Đã xoá.');$('modal').__done&&$('modal').__done('del');}
    catch(e){setMsg('Không xoá được: '+(e.code||e.message),'err');}
  };
  return p;
}

/* ---------- Xuất Excel thép đội thi công đã nhận ---------- */
async function exportSteelXlsx(list,info){

  const wb=new ExcelJS.Workbook();wb.creator='Phiếu điện tử HH12';
  const NAVY='FF0B2545',GOLD='FFC9A24B',GFILL='FFDCE6F5',YEL='FFFFF2CC',RED='FFFDE2E1',BD={style:'thin',color:{argb:'FFB7C3D6'}},BORD={top:BD,bottom:BD,left:BD,right:BD};

  const head=(ws,r,cols)=>{cols.forEach((h,i)=>cell(ws,r,i+1,h,{bold:true,color:'FFFFFFFF',fill:NAVY}));ws.getRow(r).height=32;};
  const title=(ws,t,n)=>{ws.getCell(1,1).value=t;ws.mergeCells(1,1,1,n);ws.getCell(1,1).font={name:FN,bold:true,size:14,color:{argb:NAVY}};
    ws.getCell(2,1).value=`Dự án HH12 Cổ Loa · ${info} · xuất ngày ${fmtD(today())}`;ws.mergeCells(2,1,2,n);ws.getCell(2,1).font={name:FN,italic:true};};
  const pend=list.filter(r=>steelSt(r)==='cho_duyet').length;
  const byTeam={};list.forEach(r=>{(byTeam[r.doi]=byTeam[r.doi]||[]).push(r);});

  // 1. Tổng hợp theo đội → loại thép (có dòng tổng đội, bấm +/- để thu gọn)
  const w0=wb.addWorksheet('Tong hop theo doi');[6,30,32,11,14,16,10].forEach((w,i)=>w0.getColumn(i+1).width=w);
  title(w0,'TỔNG HỢP THÉP ĐỘI THI CÔNG ĐÃ NHẬN',7);
  if(pend){w0.getCell(3,1).value=`Lưu ý: có ${pend} lượt CHƯA DUYỆT (máy đọc, chưa được cán bộ kiểm tra) — xem cột Trạng thái ở sheet "Chi tiet tung luot".`;w0.mergeCells(3,1,3,7);w0.getCell(3,1).font={name:FN,bold:true,color:{argb:'FFC0392B'}};}
  head(w0,4,['STT','Đội thi công','Loại thép','Đường kính (mm)','Số cây','Khối lượng (kg)','Số lượt']);
  let r=5,stt=0;const teamRows=[];
  teams.forEach(t=>{
    const T={};byTeam[t].forEach(rc=>(rc.items||[]).forEach(it=>{const k=typeKey(it);const x=T[k]=T[k]||{loai:k,d:steelDia(k),cay:0,kg:0,luot:new Set()};x.cay+=steelNum(it.so_cay);x.kg+=steelNum(it.khoi_luong);x.luot.add(rc.id);}));
    const rows=Object.values(T).sort((a,b)=>a.d-b.d||a.loai.localeCompare(b.loai,'vi'));
    const tr=r,f=r+1,l=r+rows.length;teamRows.push(tr);stt++;
    [stt,t,rows.length+' loại thép','',null,null,byTeam[t].length].forEach((v,c)=>cell(w0,tr,c+1,v,{bold:true,fill:GFILL,left:c===1||c===2}));
    w0.getCell(tr,5).value={formula:rows.length?`SUM(E${f}:E${l})`:'0'};w0.getCell(tr,5).numFmt=NC;
    w0.getCell(tr,6).value={formula:rows.length?`SUM(F${f}:F${l})`:'0'};w0.getCell(tr,6).numFmt=NK;
    r++;
    rows.forEach(x=>{w0.getRow(r).outlineLevel=1;['',t,x.loai,x.d||'',x.cay,x.kg,x.luot.size].forEach((v,c)=>cell(w0,r,c+1,v,{left:c===1||c===2,fmt:c===4?NC:c===5?NK:undefined}));r++;});
  });
  ['','TỔNG CỘNG ('+teams.length+' đội)','','',null,null,list.length].forEach((v,c)=>cell(w0,r,c+1,v,{bold:true,fill:GOLD,left:c===1}));
  w0.getCell(r,5).value={formula:teamRows.map(x=>'E'+x).join('+')||'0'};w0.getCell(r,5).numFmt=NC;
  w0.getCell(r,6).value={formula:teamRows.map(x=>'F'+x).join('+')||'0'};w0.getCell(r,6).numFmt=NK;
  w0.properties.outlineProperties={summaryBelow:false,summaryRight:false};w0.views=[{state:'frozen',ySplit:4}];
  // 2. Ma trận khối lượng: đường kính × đội (đối chiếu dự toán / khối lượng thiết kế)
  const dias=[...new Set(list.flatMap(rc=>(rc.items||[]).map(it=>steelDia(it.loai))))].sort((a,b)=>a-b);
  const w1=wb.addWorksheet('KL theo duong kinh');w1.getColumn(1).width=18;teams.forEach((_,i)=>w1.getColumn(i+2).width=15);w1.getColumn(teams.length+2).width=16;

    const L=w1.getColumn(teams.length+1).letter;cell(w1,rr,teams.length+2,{formula:`SUM(B${rr}:${L}${rr})`},{bold:true,fmt:NK,right:true});});
  const tr1=5+dias.length;cell(w1,tr1,1,'TỔNG',{bold:true,fill:GOLD});
  for(let c=2;c<=teams.length+2;c++){const L=w1.getColumn(c).letter;cell(w1,tr1,c,{formula:dias.length?`SUM(${L}5:${L}${tr1-1})`:'0'},{bold:true,fill:GOLD,fmt:NK,right:true});}
  w1.views=[{state:'frozen',xSplit:1,ySplit:4}];
  // 3. Chi tiết từng lượt (mỗi lượt 1 nhóm) + cảnh báo logic
  const idx=steelIndex(list);
  const w2=wb.addWorksheet('Chi tiet tung luot');[11,22,20,14,13,28,10,14,16,20,13,46].forEach((w,i)=>w2.getColumn(i+1).width=w);
  title(w2,'CHI TIẾT TỪNG LƯỢT NHẬN THÉP',12);
  head(w2,4,['Ngày nhận','Đội thi công','Người gửi','Số phiếu NCC','Biển số xe','Loại thép','Số cây','Khối lượng (kg)','Số lô','Ghi chú','Trạng thái','Cảnh báo kiểm tra logic']);
  r=5;
  list.slice().sort((a,b)=>String(a.ngay).localeCompare(String(b.ngay))||String(a.doi).localeCompare(String(b.doi),'vi')).forEach(rc=>{
    const m=rc.meta||{},st=steelSt(rc),iss=steelIssues(rc,idx),its=rc.items||[];const hr=r,f=r+1,l=r+its.length;
    const fill=st==='cho_duyet'?YEL:GFILL;
    [fmtD(rc.ngay),rc.doi,rc.nguoi_nop||'',m.so_phieu||'',m.bien_so_xe||'',its.length+' dòng',null,null,'',rc.ghi_chu||'',STEEL_ST[st],iss.join('\n')].forEach((v,c)=>cell(w2,hr,c+1,v,{bold:c<6||c===10,fill:(c===11&&iss.length)?RED:fill,left:c>=1&&c!==6&&c!==7&&c!==10}));
    w2.getCell(hr,7).value={formula:its.length?`SUM(G${f}:G${l})`:'0'};w2.getCell(hr,7).numFmt=NC;
    w2.getCell(hr,8).value={formula:its.length?`SUM(H${f}:H${l})`:'0'};w2.getCell(hr,8).numFmt=NK;
    r++;
    its.forEach(it=>{w2.getRow(r).outlineLevel=1;const ww=steelWarn(it);
      [fmtD(rc.ngay),rc.doi,'','','',it.loai||'',steelNum(it.so_cay),steelNum(it.khoi_luong),it.so_lo||'',it.ghi_chu||'',STEEL_ST[st],ww.join('; ')].forEach((v,c)=>cell(w2,r,c+1,v,{left:c===1||c===5||c===9||c===11,fmt:c===6?NC:c===7?NK:undefined,fill:(c===11&&ww.length)?RED:undefined}));r++;});
  });
  w2.properties.outlineProperties={summaryBelow:false,summaryRight:false};w2.views=[{state:'frozen',ySplit:4}];
  const buf=await wb.xlsx.writeBuffer();
  await deliverFile('Tong-hop-thep-doi-nhan_'+PROJECT_CODE+'_'+today()+'.xlsx',new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

   <div class="row"><input id="ssq" placeholder="Tìm đội, người gửi, số phiếu" style="max-width:240px"><select id="ssd"><option value="">Mọi đội</option>${LISTS.DOI.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join('')}</select><label class="hint">Từ <input type="date" id="ssd1" style="width:auto"></label><label class="hint">Đến <input type="date" id="ssd2" style="width:auto"></label>
    <button type="button" class="btn red sm" id="ssXlsx">Xuất Excel</button><a class="btn blue sm" href="#/thep-nhap" style="margin-left:auto">+ Gửi ảnh thép mới</a></div>
   <div class="stats" id="ssSum" style="margin:12px 0"></div><div id="ssJobs"></div><div id="ssPend"></div><div id="ssList" style="display:flex;flex-direction:column;gap:10px"></div>
   <p class="hint">Đội gửi ảnh biên bản → máy chủ tự đọc số liệu (khoảng 10 phút) → cán bộ kỹ thuật đối chiếu ảnh gốc, sửa nếu sai rồi duyệt → ảnh gốc được xoá, chỉ giữ số liệu. Hệ thống tự cảnh báo khi khối lượng không khớp số cây theo đường kính (cây 11,7 m), khi ảnh hoặc số lô bị gửi trùng. Tổng hợp tính cả lượt chờ duyệt.</p>`;
  draw();
  $('ssq').oninput=e=>{q=e.target.value;draw();};$('ssd').onchange=e=>{fd=e.target.value;draw();};$('ssd1').onchange=e=>{d1=e.target.value;draw();};$('ssd2').onchange=e=>{d2=e.target.value;draw();};
  $('ssXlsx').onclick=async()=>{const b=$('ssXlsx');b.disabled=true;try{await exportSteelXlsx(flt(),[fd?'đội '+fd:'tất cả các đội',d1||d2?`từ ${d1?fmtD(d1):'…'} đến ${d2?fmtD(d2):'…'}`:'toàn bộ thời gian'].join(' · '));}catch(e){toast('Không xuất được Excel: '+(e.message||e));}b.disabled=false;};
  const un1=DB.watchSteelReceipts(list=>{all=list;draw();},e=>{toast('Lỗi tải số liệu thép: '+(e.code||e.message));});
  unJ=DB.watchSteelJobs(list=>{jobs=list;draw();if(list.some(j=>j.status==='cho'&&Date.now()-(j.createdAt||0)>12*60e3))pingSteel();},e=>{console.warn('steel_queue',e);});
  unwatch=()=>{try{un1&&un1();}catch(e){}try{unJ&&unJ();}catch(e){}};
}

const bbGia=c=>bbGiaIn(BB_GIA,c);
const bbCat=c=>BB_DB_CAT.find(x=>x[0]===c);
const bbSl=v=>{const n=Number(String(v??'').replace(',','.').replace(/[^\d.]/g,''));return isFinite(n)?n:0;};

    const m=BB_MD[x.code];

const BB_DB_INLINE=3;
const bbDbOf=r=>r.tongDenBu!=null?r.tongDenBu:bbInt(r.denBu);

const BB_MUC={nhe:'Nhẹ',tb:'Trung bình',nang:'Nặng'};

function bbDoc3(n,full){const tr=Math.floor(n/100),ch=Math.floor(n%100/10),dv=n%10,s=[];
  if(full||tr>0)s.push(BB_CS[tr]+' trăm');
  if(ch>1){s.push(BB_CS[ch]+' mươi');if(dv===1)s.push('mốt');else if(dv===5)s.push('lăm');else if(dv===4)s.push('tư');else if(dv>0)s.push(BB_CS[dv]);}
  else if(ch===1){s.push('mười');if(dv===5)s.push('lăm');else if(dv>0)s.push(BB_CS[dv]);}
  else if(dv>0){if(full||tr>0)s.push('linh');s.push(BB_CS[dv]);}
  return s.join(' ');}
function bbDocSo(n){n=Math.round(n);if(!n)return 'Không đồng';const u=['',' nghìn',' triệu',' tỷ',' nghìn tỷ'],g=[];while(n>0){g.push(n%1000);n=Math.floor(n/1000);}
  const p=[];for(let i=g.length-1;i>=0;i--){if(!g[i])continue;p.push(bbDoc3(g[i],i<g.length-1)+u[i]);}
  const s=p.join(' ').replace(/\s+/g,' ').trim();return s.charAt(0).toUpperCase()+s.slice(1)+' đồng';}
const bbTier=(v,lan)=>v.t.length===1?v.t[0]:v.t[Math.min(Math.max(lan,1),3)-1];
function bbAmount(v,lan,muc){const [a,b]=bbTier(v,lan).map(x=>x*1e6);if(muc==='nang')return b;if(muc==='tb')return Math.round((a+b)/2/1e5)*1e5;return a;}

/* ---------- lần vi phạm: đếm theo lịch sử của đội với đúng lỗi đó (biên bản chờ duyệt + đã duyệt) ---------- */
function bbPrior(all,doi,code,exceptId){let n=0;const d=bbNorm(doi);
  all.forEach(r=>{if(r.id===exceptId||!['cho_duyet','da_duyet'].includes(r.status)||bbNorm(r.doi)!==d)return;(r.rows||[]).forEach(x=>{if(x.code===code)n++;});});return n;}
function bbLan(all,rec,i){const row=rec.rows[i];if(!row.code||!rec.doi)return 1;
  if(rec.status==='cho_duyet'||rec.status==='da_duyet')return row.lan||1;
  let n=bbPrior(all,rec.doi,row.code,rec.id);for(let j=0;j<i;j++)if(rec.rows[j].code===row.code)n++;return n+1;}
function bbRows(all,rec){return rec.rows.map((r,i)=>{const v=BB_VM[r.code];if(!v)return {...r,lan:1,khung:null,tien:0};
  const lan=bbLan(all,rec,i),muc=r.mucTay?r.muc:bbMucFromSl(r.sl),[a,b]=bbTier(v,lan).map(x=>x*1e6);
  const tien=r.tienTay?Math.min(b,Math.max(a,bbInt(r.tien))):bbAmount(v,lan,muc);
  return {...r,lan,muc,khung:[a,b],tien,v};});}
function bbTotals(all,rec){const rows=bbRows(all,rec),phat=rows.reduce((s,r)=>s+(r.v?r.tien:0),0),dbI=bbDbItems(rec),dbTB=dbI.reduce((s,x)=>s+x.tt,0),dbKhac=bbInt(rec.denBu),db=dbTB+dbKhac;return {rows,phat,dbI,dbTB,dbKhac,denBu:db,tong:phat+db};}
function bbActs(rows){const set=[];rows.forEach(r=>{if(!r.v)return;r.v.a.forEach(a=>{if(!set.includes(a))set.push(a);});if(r.lan>=3&&r.v.a3&&!set.includes(r.v.a3))set.push(r.v.a3);});return set;}

/* ---------- nội dung tự soạn ---------- */
function bbText(all,rec,nPhotos){

  if(dbKhac)L.push(`- Chi phí phát sinh khác: ${bbVnd(dbKhac)} đ${rec.denBuGhiChu?' ('+rec.denBuGhiChu+')':''}.`);

  if(rec.ghiChu)L.push(`Ghi chú: ${rec.ghiChu}`);

}

function bbFit(root){root.querySelectorAll('.bb-nd').forEach(el=>{el.classList.remove('s1','s2');if(el.scrollHeight>el.clientHeight+2){el.classList.add('s1');if(el.scrollHeight>el.clientHeight+2){el.classList.remove('s1');el.classList.add('s2');}}});}
const bbOverflow=root=>[...root.querySelectorAll('.bb-nd')].some(el=>el.scrollHeight>el.clientHeight+2);
async function bbCompress(file){
  const im=await new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i);};i.onerror=rej;i.src=u;});
  let side=1280,q=0.72,out='';
  for(let k=0;k<5;k++){const s=Math.min(1,side/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<230000)break;side*=0.8;q-=0.08;}
  return out;
}
const bbPdfName=r=>{const d=String(r.doi||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'');return `${r.so||'BBP-nhap'}_${d}_${r.ngay}.pdf`;};

}

  const wb=new ExcelJS.Workbook();wb.creator='Phiếu điện tử HH12';
  const NAVY='FF0B2545',GOLD='FFC9A24B',RED='FFFDE2E1',BD={style:'thin',color:{argb:'FFB7C3D6'}},BORD={top:BD,bottom:BD,left:BD,right:BD},FN='Times New Roman',MF='#,##0';
  const cell=(ws,r,c,v,o={})=>{const x=ws.getCell(r,c);if(v!==undefined)x.value=v;x.border=BORD;x.font={name:FN,bold:!!o.bold,color:o.color?{argb:o.color}:undefined};x.alignment={vertical:'middle',wrapText:true,horizontal:o.left?'left':'center'};if(o.fill)x.fill={type:'pattern',pattern:'solid',fgColor:{argb:o.fill}};if(o.fmt)x.numFmt=o.fmt;return x;};

  ['C','D','E','F','G'].forEach((L,k)=>cell(w0,tr,3+k,{formula:T.length?`SUM(${L}5:${L}${tr-1})`:'0'},{bold:true,fill:GOLD,fmt:k>=2?MF:undefined}));cell(w0,tr,8,'',{fill:GOLD});
  w0.views=[{state:'frozen',ySplit:4}];
  // 2. Chi tiết từng lỗi
  const w1=wb.addWorksheet('Chi tiet tung loi');[16,11,24,20,26,7,40,7,11,14,14,16,44,20,12].forEach((w,i)=>w1.getColumn(i+1).width=w);

  w1.views=[{state:'frozen',ySplit:4}];w1.autoFilter={from:{row:4,column:1},to:{row:Math.max(4,r-1),column:15}};
  // 3. Chi tiết đền bù thiết bị

         <label class="f" for="ds${i}">Số lượng *<input id="ds${i}" data-d="sl" inputmode="decimal" value="${esc(x.sl)}" placeholder="0"></label>

         <div class="tt">Thành tiền<b data-tt>${bbVnd(tt)} đ</b></div>
         <button type="button" class="btn sm" data-deldb="${i}" aria-label="Xoá thiết bị ${i+1}" title="Xoá">✕</button></div>`;}).join(''):'<p class="hint" style="margin:0">Chưa có thiết bị đền bù.</p>';};
    const sumGen=(t,rows)=>{t=t||bbTotals(all,cur);rows=rows||t.rows;
      $('bSum').innerHTML=`<div><span>Tổng tiền phạt</span><b>${bbVnd(t.phat)} đ</b></div><div><span>Đền bù thiết bị${t.dbKhac?' + chi phí khác':''}</span><b>${bbVnd(t.denBu)} đ</b></div><div><span>Tổng khấu trừ</span><b style="color:var(--bad)">${bbVnd(t.tong)} đ</b></div>`;
      const nd=rows.filter(r=>bbNeedDb(r.v)).map(r=>r.code);$('bDbHint').hidden=!(nd.length&&!t.denBu);
      if(nd.length&&!t.denBu)$('bDbHint').textContent=`Lỗi ${nd.join(', ')} có yêu cầu đền bù thiệt hại — nhập thiết bị hư hỏng/mất bên dưới (nếu có).`;
      $('bDbRows').querySelectorAll('.bb-dbr').forEach(el=>{const x=cur.dbItems[+el.dataset.di];if(!x)return;const gT=x.code==='__k'?0:bbGia(x.code),gia=(x.giaTay||!gT)?bbInt(x.gia):gT;el.querySelector('[data-tt]').textContent=bbVnd(Math.round(gia*bbSl(x.sl)))+' đ';});
      $('bGen').textContent=bbText(all,cur,photos.length);
      const w3=rows.filter(r=>r.v&&r.lan>=3);$('bbWarn3').hidden=!w3.length;
      if(w3.length)$('bbWarn3').innerHTML=`<b>Cảnh báo:</b> ${esc(cur.doi)} đã vi phạm ${w3.map(r=>'mục '+r.code+' lần '+r.lan).join(', ')} — theo phụ lục: ${esc([...new Set(w3.map(r=>r.v.a3).filter(Boolean))].join('; ')||'áp mức cao nhất')}.`;};
    const photosUI=()=>{$('bThumbs').innerHTML=photos.map((p,i)=>`<figure><img src="${p.data}" alt="Ảnh ${i+1}"><figcaption><input aria-label="Chú thích ảnh ${i+1}" data-cap="${i}" placeholder="Chú thích ảnh ${i+1}" value="${esc(p.cap||'')}"><button type="button" class="btn sm" data-delp="${i}">Xoá ảnh</button></figcaption></figure>`).join('');
      $('bPhInfo').textContent=photos.length?`${photos.length}/12 ảnh`:'Chưa có ảnh';};
    const load=()=>{
      ['bNgay:ngay','bGio:gioBD','bHm:hangMuc','bVt:viTri','bNtp:ntpTen','bCv:ntpCv','bDb:denBu','bDbG:denBuGhiChu','bGhi:ghiChu','bTcLd:tuChoiLyDo','bCk:chungKien'].forEach(x=>{const [id,k]=x.split(':');$(id).value=cur[k]||'';$(id).classList.remove('invalid');});

      $('bbTraLai').hidden=cur.status!=='tra_lai';if(cur.status==='tra_lai')$('bbTraLai').textContent='CHP trả lại biên bản '+(cur.so||'')+': '+((cur.traLai&&cur.traLai.lyDo)||'')+'. Sửa theo yêu cầu rồi gửi duyệt lại.';

    };
    const mine=()=>{const l=all.filter(r=>(r.status==='nhap'||r.status==='tra_lai')&&(ME.isAdmin||(r.lap&&r.lap.email===U.email))).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      $('bbMine').innerHTML=l.length?l.map(r=>bbCard(r,`<button type="button" class="btn sm line" data-edit="${r.id}">Mở để sửa</button><button type="button" class="btn sm" data-delr="${r.id}" style="color:var(--bad);border-color:var(--bad)">Xoá</button>`)).join(''):'<p class="hint">Không có nháp hay biên bản bị trả lại. Điền các bước bên dưới để lập biên bản mới.</p>';
      $('bbMine').querySelectorAll('[data-edit]').forEach(b=>b.onclick=async()=>{const r=all.find(x=>x.id===b.dataset.edit);if(!r)return;b.disabled=true;try{const [ph,fl]=await Promise.all([DB.getBbpPhotos(r.id),DB.getBbpFiles(r.id)]);cur=JSON.parse(JSON.stringify(r));photos=ph;files={sigNtp:fl.sigNtp||''};dirtyPhotos=false;load();saveLocal();window.scrollTo({top:$('bbTraLai').offsetTop-20,behavior:'smooth'});}catch(e){toast('Không mở được: '+(e.code||e.message));}b.disabled=false;});

    const startNew=()=>{cur=bbBlank();photos=[];files={};dirtyPhotos=false;try{localStorage.removeItem('bbp-cur');}catch(e){}load();setMsg('');};
    if(!cur){try{const d=JSON.parse(localStorage.getItem('bbp-cur')||'null');if(d&&d.cur&&d.cur.rows){cur=d.cur;files={sigNtp:d.sigNtp||''};needPh=true;}}catch(e){}}
    if(!cur)cur=bbBlank();
    load();mine();
    renderLap.gia=()=>{dbRows();sumGen();};
    renderLap.refresh=async()=>{mine();fillDoi();
      if(needPh&&!dirtyPhotos&&!photos.length&&all.some(x=>x.id===cur.id)){needPh=false;try{const [ph,fl]=await Promise.all([DB.getBbpPhotos(cur.id),DB.getBbpFiles(cur.id)]);photos=ph;if(!files.sigNtp)files.sigNtp=fl.sigNtp||'';photosUI();ntpSig();}catch(e){}}const sg=bbRows(all,cur).map(r=>r.lan).join(',');if(sg!==lanSig){lanSig=sg;render();}else sumGen();};
    $('bbNew').onclick=()=>{if(cur&&(cur.viTri||cur.doi||cur.rows.some(r=>r.code))&&!confirm('Bỏ biên bản đang soạn (chưa lưu) để lập mới?'))return;startNew();};
    const sec=$('bbLap');
    sec.addEventListener('input',e=>{
      const k=e.target.dataset.k;if(k){cur[k]=e.target.value;e.target.classList.remove('invalid');if(k==='ntpTen')ntpTitle();sumGen();saveLocal();return;}
      const r=e.target.dataset.r;if(r){const box=e.target.closest('.bb-vio'),i=+box.dataset.i,row=cur.rows[i];
        if(r==='sl'){row.sl=e.target.value.replace(/[^\d]/g,'');e.target.value=row.sl;row.tienTay=false;if(!row.mucTay)row.muc=bbMucFromSl(row.sl);}
        if(r==='mota')row.mota=e.target.value;
        if(r==='tien'){row.tien=bbInt(e.target.value);row.tienTay=true;}
        e.target.classList.remove('invalid');sumGen();saveLocal();
        if(r==='sl'){const cr=bbRows(all,cur)[i];box.querySelectorAll('[data-muc]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.muc===cr.muc));const t=box.querySelector('[data-r="tien"]');if(t&&cr.v)t.value=bbVnd(cr.tien);}
        return;}
      const dd=e.target.dataset.d;if(dd&&dd!=='code'){const x=cur.dbItems[+e.target.closest('.bb-dbr').dataset.di];
        if(dd==='sl'){x.sl=e.target.value.replace(/[^\d.,]/g,'');e.target.value=x.sl;}
        if(dd==='gia'){x.gia=bbInt(e.target.value);x.giaTay=true;}
        if(dd==='ten')x.ten=e.target.value;if(dd==='dvt')x.dvt=e.target.value;
        e.target.classList.remove('invalid');sumGen();saveLocal();return;}
      const cp=e.target.dataset.cap;if(cp!=null){photos[+cp].cap=e.target.value;dirtyPhotos=true;}
    });
    sec.addEventListener('change',e=>{
      if(e.target.dataset.r==='code'){const i=+e.target.closest('.bb-vio').dataset.i;cur.rows[i].code=e.target.value;cur.rows[i].tienTay=false;render();saveLocal();}
      if(e.target.dataset.r==='tien'){render();}
      if(e.target.dataset.d==='code'){const i=+e.target.closest('.bb-dbr').dataset.di;cur.dbItems[i]={...bbDbBlank(),code:e.target.value,sl:cur.dbItems[i].sl};dbRows();sumGen();saveLocal();const n=$(e.target.value==='__k'?'dn'+i:'ds'+i);if(n)n.focus();}

      if(e.target.id==='bDoi'){if(e.target.value==='__k'){cur._khac=true;$('bDoiKW').hidden=false;cur.doi=$('bDoiK').value.trim();$('bDoiK').focus();}else{cur._khac=false;$('bDoiKW').hidden=true;cur.doi=e.target.value;}ntpTitle();render();saveLocal();}
      if(e.target.id==='bDb'){const v=bbInt(e.target.value);cur.denBu=v?bbVnd(v):'';e.target.value=cur.denBu;sumGen();saveLocal();}

      if(e.target.id==='bTuChoi'){cur.tuChoi=e.target.checked;$('bTuChoiBox').hidden=!cur.tuChoi;if(cur.tuChoi)files.sigNtp='';ntpSig();sumGen();saveLocal();}
    });
    sec.addEventListener('click',e=>{
      const m=e.target.closest('[data-muc]');if(m){const i=+m.closest('.bb-vio').dataset.i;Object.assign(cur.rows[i],{muc:m.dataset.muc,mucTay:true,tienTay:false});render();saveLocal();return;}

      const p=e.target.closest('[data-delp]');if(p){photos.splice(+p.dataset.delp,1);dirtyPhotos=true;photosUI();sumGen();return;}

    $('bAddV').onclick=()=>{cur.rows.push(bbBlankRow());render();saveLocal();};
    $('bAddDb').onclick=()=>{cur.dbItems=cur.dbItems||[];if(cur.dbItems.length>=30){setMsg('Tối đa 30 dòng thiết bị đền bù.','err');return;}cur.dbItems.push(bbDbBlank());dbRows();sumGen();saveLocal();const n=$('dc'+(cur.dbItems.length-1));if(n)n.focus();};
    $('bPick').onchange=async e=>{const fl=[...e.target.files].filter(f=>/^image\//.test(f.type));e.target.value='';const room=12-photos.length;
      if(room<=0){setMsg('Đã đủ 12 ảnh. Xoá bớt để thêm ảnh khác.','err');return;}
      $('bPhInfo').textContent='Đang nén ảnh…';for(const f of fl.slice(0,room)){try{photos.push({data:await bbCompress(f),cap:''});dirtyPhotos=true;}catch(err){}}
      if(fl.length>room)setMsg(`Chỉ nhận thêm ${room} ảnh (tối đa 12).`,'err');photosUI();sumGen();};
    const grabNtp=()=>{if(ntpPad&&!ntpPad.empty())files.sigNtp=ntpPad.data();};
    const validate=()=>{const miss=[],mark=(id,l)=>{const el=$(id);if(el)el.classList.add('invalid');miss.push(l);};
      document.querySelectorAll('#bbBody .invalid').forEach(x=>x.classList.remove('invalid'));
      if(!cur.ngay)mark('bNgay','Ngày lập');else if(cur.ngay>today())mark('bNgay','Ngày lập không được sau hôm nay');
      if(!cur.gioBD)mark('bGio','Giờ bắt đầu');if(!String(cur.viTri).trim())mark('bVt','Vị trí');
      if(!cur.doi)mark($('bDoi').value==='__k'?'bDoiK':'bDoi','Đội vi phạm');if(!String(cur.ntpTen).trim())mark('bNtp','Tên đại diện nhà thầu');if(!cur.ntpCv)mark('bCv','Chức vụ đại diện');
      cur.rows.forEach((r,i)=>{if(!r.code)mark('vc'+i,'Lỗi '+(i+1));if(!String(r.mota).trim())mark('vm'+i,'Mô tả lỗi '+(i+1));});
      const codes=cur.rows.map(r=>r.code).filter(Boolean);if(new Set(codes).size<codes.length)miss.push('Một lỗi bị chọn 2 lần — gộp vào 1 dòng và ghi rõ số lượng');
      (cur.dbItems||[]).forEach((x,i)=>{const L='thiết bị đền bù '+(i+1);if(!x.code){mark('dc'+i,'Chọn '+L);return;}

        if(!(bbSl(x.sl)>0))mark('ds'+i,'Số lượng '+L);
        const gT=x.code==='__k'?0:bbGia(x.code);if(!((x.giaTay||!gT)?bbInt(x.gia):gT))mark('dg'+i,'Đơn giá '+L+(x.code!=='__k'?' ('+x.code+' chưa có trong bảng giá)':''));});
      if(!photos.length)miss.push('Ít nhất 1 ảnh hiện trường');
      if(!(ME.profile&&ME.profile.signature))miss.push('Chữ ký người lập (khai báo ở mục Chữ ký)');
      if(cur.tuChoi){if(!String(cur.tuChoiLyDo).trim())mark('bTcLd','Lý do từ chối ký');if(!String(cur.chungKien).trim())mark('bCk','Người chứng kiến');}
      else if(!files.sigNtp)miss.push('Chữ ký đại diện nhà thầu (hoặc tick "từ chối ký")');
      return miss;};
    const recOut=()=>{const c=JSON.parse(JSON.stringify(cur));delete c._khac;c.photoCount=photos.length;const t=bbTotals(all,cur);c.tongPhat=t.phat;c.tongDenBu=t.denBu;c.tongCong=t.tong;c.lap=bbLapOf(cur);
      c.dbItems=(c.dbItems||[]).filter(x=>x.code);const it=bbDbItems(cur);c.dbItems=c.dbItems.map((x,i)=>{const y=it[i]||{};return {code:x.code,ten:y.ten||'',dvt:y.dvt||'',sl:x.sl,gia:y.gia||0,giaTay:!!x.giaTay,tt:y.tt||0};});return c;};

      {const t0=bbTotals(all,cur),nd=t0.rows.filter(r=>bbNeedDb(r.v)).map(r=>r.code);if(nd.length&&!t0.denBu&&!confirm(`Lỗi ${nd.join(', ')} có yêu cầu đền bù thiệt hại nhưng chưa nhập thiết bị đền bù.\nBấm OK nếu không có thiết bị hư hỏng/mất, Huỷ để quay lại nhập.`))return;}

        if(!r.gioKT){const n=bbNowT();if(r.ngay===today()&&n>=r.gioBD)r.gioKT=n;else{const [hh,mm]=r.gioBD.split(':').map(Number),t=Math.min(23*60+59,hh*60+mm+30);r.gioKT=pad2(Math.floor(t/60))+':'+pad2(t%60);}}
        if(!r.so){const n=await DB.nextSeq('BBP_'+PROJECT_CODE);r.so='BBP-'+PROJECT_CODE+'-'+String(n).padStart(3,'0');}
        r.status='cho_duyet';r.submittedAt=Date.now();r.traLai=null;
        await DB.saveBbp(r,{sigLap:ME.profile.signature,sigNtp:cur.tuChoi?'':(files.sigNtp||'')},(dirtyPhotos||!all.some(x=>x.id===r.id))?photos:null);

      }catch(e){setMsg('Không gửi được: '+(e.code||e.message),'err');}
      $('bSend').disabled=false;};
  };

  /* ===== Danh sách ===== */
  const bbCard=(r,btns)=>`<div class="slipcard"><span><b>${esc(r.so||'Nháp')} · ${esc(r.doi||'Chưa chọn đội')}</b><br><small class="hint">${esc(fmtD(r.ngay))} · ${esc([r.hangMuc,r.viTri].filter(Boolean).join(' – '))} · ${(r.rows||[]).length} lỗi · <b>${bbVnd(r.tongCong||0)} đ</b>${r.lap?' · lập: '+esc(r.lap.name):''}</small></span><span class="row" style="gap:6px"><span class="badge ${BB_STC[r.status]||''}">${BB_ST[r.status]||r.status}</span>${btns}</span></div>`;
  const renderDuyet=()=>{const l=all.filter(r=>r.status==='cho_duyet').sort((a,b)=>(a.submittedAt||0)-(b.submittedAt||0));
    body.innerHTML=`<section class="panel"><h2>Biên bản chờ CHP duyệt</h2><p class="hint">${ME.isAdmin?'Mở từng biên bản, kiểm tra ảnh và số tiền (sửa được trong khung), ký duyệt để xuất PDF gửi các bên.':'Chỉ CHP (anh '+BB_CHP+') ký duyệt. Bạn xem được trạng thái tại đây.'}</p>
     <div style="display:flex;flex-direction:column;gap:8px">${l.length?l.map(r=>bbCard(r,`<button type="button" class="btn sm ${ME.isAdmin?'red':'line'}" data-view="${r.id}">${ME.isAdmin?'Xem & duyệt':'Xem'}</button>`)).join(''):'<p class="hint">Không có biên bản nào chờ duyệt.</p>'}</div></section>`;
    body.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>openRec(b.dataset.view,b));};
  let fD='',fTh='',fQ='';
  const renderLuu=()=>{
    body.innerHTML=`<section class="panel"><h2>Biên bản phạt NTP-ĐTC đã duyệt</h2>
     <div class="grid"><label class="f" for="lD">Đội<select id="lD"><option value="">Tất cả</option>${[...new Set(all.map(r=>r.doi).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi')).map(d=>`<option${d===fD?' selected':''}>${esc(d)}</option>`).join('')}</select></label>
      <label class="f" for="lT">Tháng<input id="lT" type="month" value="${esc(fTh)}"></label><label class="f" for="lQ">Tìm số biên bản / nội dung<input id="lQ" type="search" value="${esc(fQ)}" placeholder="VD: BBP-HH12-007, giằng"></label></div>

    const sum=()=>{const n=BB_DB_CAT.length,c=BB_DB_CAT.filter(x=>bbGiaIn(G,x[0])>0).length;$('gSum').innerHTML=`<div><span>Tổng số mã</span><b>${n}</b></div><div><span>Đã có giá</span><b>${c}</b></div><div><span>Chưa có giá</span><b style="color:${n-c?'var(--bad)':'inherit'}">${n-c}</b></div>`;};
    const draw=()=>{const q=bbNorm(gQ),rows=Object.entries(BB_DB_CATS).filter(([k])=>!gH||k===gH).flatMap(([k,l])=>l.map(x=>[...x,k])).filter(x=>(!q||bbNorm(x[0]+' '+x[1]+' '+x[3]).includes(q))&&(!gF||(gF==='1')===(bbGiaIn(G,x[0])>0)));
      $('gBody').innerHTML=rows.length?rows.map(x=>{const g=Number(G[x[0]])||0,m=BB_MD[x[0]];if(m){const gm=Number(G[m[0]])||0;return `<tr><td><b>${esc(x[0])}</b></td><td>${esc(x[1])}</td><td>${esc(x[3])}</td><td>${esc(x[2])}</td><td style="text-align:right">${gm?`<b>${bbVnd(gm*m[1])}</b><br><span class="hint" style="font-size:11.5px">= ${m[1]} md × ${bbVnd(gm)} (${esc(m[0])})</span>`:`<span class="hint">theo giá ${esc(m[0])}/md</span>`}</td></tr>`;}
        return `<tr><td><b>${esc(x[0])}</b></td><td>${esc(x[1])}</td><td>${esc(x[3])}</td><td>${esc(x[2])}</td><td style="text-align:right">${ad?`<input class="gia-in" data-g="${esc(x[0])}" inputmode="numeric" aria-label="Đơn giá ${esc(x[0])}" value="${g?bbVnd(g):''}" placeholder="—">`:(g?`<b>${bbVnd(g)}</b>`:'<span class="hint">chưa có</span>')}</td></tr>`;}).join(''):'<tr><td colspan="5" class="hint">Không có mã phù hợp.</td></tr>';};
    meta();sum();draw();
    $('gQ').oninput=e=>{gQ=e.target.value;draw();};$('gH').onchange=e=>{gH=e.target.value;draw();};$('gF').onchange=e=>{gF=e.target.value;draw();};
    if(ad){
      $('gBody').addEventListener('input',e=>{const c=e.target.dataset.g;if(!c)return;const v=bbInt(e.target.value);if(v)G[c]=v;else delete G[c];gDirty=true;$('gMsg').textContent='Có thay đổi chưa lưu.';sum();});
      $('gBody').addEventListener('change',e=>{const c=e.target.dataset.g;if(c)e.target.value=G[c]?bbVnd(G[c]):'';});
      $('gPasteGo').onclick=()=>{const lines=$('gPaste').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean),bad=[];let ok=0;
        lines.forEach(l=>{const parts=l.split(/\t|;|\s{2,}/).map(x=>x.trim()).filter(Boolean),code=(parts[0]||'').toUpperCase().replace(/\s+/g,''),c=BB_DB_CAT.find(x=>x[0].toUpperCase()===code),v=bbInt(parts[parts.length-1]);
          if(c&&v&&parts.length>1&&!BB_MD[c[0]]){G[c[0]]=v;ok++;}else bad.push(l.slice(0,30));});
        gDirty=gDirty||ok>0;$('gPasteMsg').textContent=`Đã áp ${ok} mã.`+(bad.length?` Không nhận ${bad.length} dòng: ${bad.slice(0,5).join(' | ')}`:'')+(ok?' Bấm "Lưu bảng giá" để lưu.':'');sum();draw();};

/* ---------- Xem / duyệt ---------- */
function bbViewer(all,rec,photos,files,mode){
  let R=JSON.parse(JSON.stringify(rec));
  const p=modal(`<div class="row" style="justify-content:space-between"><h3>${esc(R.so||'Bản xem trước')} · ${esc(R.doi||'')}</h3><button class="btn sm" data-m="x">Đóng</button></div><div id="bvAct" style="display:flex;flex-direction:column;gap:12px"></div><div class="pvbox" id="bvBox"><div class="pvin" id="bvPv"></div></div>`);
  const box=$('modal').firstChild&&$('modal').firstChild.firstChild;if(box)box.style.maxWidth='900px';
  const paint=()=>{$('bvPv').innerHTML=bbSheets(all,R,photos,files);bbFit($('bvPv'));fitPreview($('bvBox'));
    if(mode==='preview'&&bbOverflow($('bvPv')))$('bvAct').insertAdjacentHTML('beforeend','<div class="msg err">Nội dung dài quá 1 trang — rút gọn mô tả hoặc ghi chú.</div>');};
  let a='';
  if(mode==='preview')a='<p class="hint">Bản xem trước. Số biên bản và giờ kết thúc được cấp khi gửi duyệt; chữ ký CHP có sau khi duyệt.</p>';
  if(mode==='approve'){const sig=ME.profile&&ME.profile.signature;
    a=`<div class="panel" style="margin:0;padding:12px"><h3 class="g">Kiểm tra số tiền (sửa được trong khung của lần vi phạm)</h3>
      ${(R.rows||[]).map((x,i)=>{const v=BB_VM[x.code],[lo,hi]=bbTier(v,x.lan).map(z=>z*1e6);return `<div class="grid" style="align-items:end"><div><b>${x.code}</b> ${esc(v.n)}<br><span class="hint">Lần ${x.lan} · ${BB_MUC[x.muc]} · khung ${bbVnd(lo)} – ${bbVnd(hi)} đ</span></div><label class="f" for="ap${i}">Số tiền duyệt<input id="ap${i}" data-ap="${i}" inputmode="numeric" style="font-weight:700" value="${bbVnd(x.tien)}"></label></div>`;}).join('')}
      ${(()=>{const it=bbDbItems(R);return it.length||bbInt(R.denBu)?`<div class="hint" style="margin:6px 0"><b>Đền bù:</b> ${it.map(x=>`${x.code==='__k'?'':x.code+' '}${esc(x.ten)} ${bbSlFmt(x.sl)} ${esc(x.dvt)} × ${bbVnd(x.gia)}${x.code!=='__k'&&bbGia(x.code)&&bbGia(x.code)!==x.gia?` <span style="color:var(--bad)">(bảng giá hiện tại ${bbVnd(bbGia(x.code))})</span>`:''} = <b>${bbVnd(x.tt)} đ</b>`).join('; ')}${bbInt(R.denBu)?`; chi phí khác ${bbVnd(bbInt(R.denBu))} đ`:''} → tổng đền bù <b>${bbVnd(bbDbOf(R))} đ</b>. Sai thì trả lại người lập.</div>`:'';})()}
      <label class="f" for="apNote">Ý kiến CHP (in vào ghi chú, không bắt buộc)<input id="apNote"></label></div>
     ${sig?`<div class="row"><div class="sigprev" style="max-width:200px"><img src="${sig}" alt="Chữ ký CHP"></div><span class="hint">Ký duyệt bằng chữ ký đã khai báo.</span></div>`:'<div class="warnbox"><b style="color:var(--bad)">Anh chưa khai báo chữ ký.</b> <a href="#/ho-so">Khai báo chữ ký</a> rồi quay lại duyệt.</div>'}
     <div class="row"><button type="button" class="btn red" id="apOk"${sig?'':' disabled'}>Ký duyệt &amp; xuất PDF</button><button type="button" class="btn" id="apNo" style="color:var(--bad);border-color:var(--bad)">Trả lại người lập</button></div>
     <div id="apNoBox" class="grid" hidden><label class="f" for="apWhy">Lý do trả lại *<input id="apWhy"></label><button type="button" class="btn" id="apNoGo" style="align-self:end;color:var(--bad);border-color:var(--bad)">Xác nhận trả lại</button></div>
     <div id="apMsg" class="msg" hidden></div>`;}
  if(mode==='view'&&R.status==='da_duyet')a=`<div class="row"><button type="button" class="btn red" id="bvPdf">PDF / gửi Zalo</button><span class="hint">Duyệt lúc ${esc(fmtDT(R.duyet&&R.duyet.at))}</span></div>`;
  $('bvAct').innerHTML=a;
  const msg=(t,k)=>{const m=$('apMsg');if(!m)return;m.hidden=!t;m.className='msg '+(k||'');m.textContent=t||'';};
  const recalc=()=>{R.tongPhat=(R.rows||[]).reduce((s,x)=>s+x.tien,0);R.tongCong=R.tongPhat+bbDbOf(R);};
  if(mode==='approve'){
    $('bvAct').addEventListener('change',e=>{const i=e.target.dataset.ap;if(i==null)return;const x=R.rows[+i],[lo,hi]=bbTier(BB_VM[x.code],x.lan).map(z=>z*1e6);x.tien=Math.min(hi,Math.max(lo,bbInt(e.target.value)));e.target.value=bbVnd(x.tien);recalc();paint();});
    $('apNo').onclick=()=>{$('apNoBox').hidden=false;$('apWhy').focus();};
    $('apNoGo').onclick=async()=>{const why=$('apWhy').value.trim();if(!why){$('apWhy').classList.add('invalid');return;}
      try{const r=JSON.parse(JSON.stringify(rec));r.status='tra_lai';r.traLai={lyDo:why,at:Date.now(),boi:ME.name};await DB.saveBbp(r,null,null);toast('Đã trả lại '+r.so);$('modal').__done&&$('modal').__done('x');}catch(e){msg('Không trả lại được: '+(e.code||e.message),'err');}};
    $('apOk').onclick=async()=>{const b=$('apOk');b.disabled=true;msg('Đang ký duyệt và tạo PDF…');
      try{const note=$('apNote').value.trim();if(note)R.ghiChu=(R.ghiChu?R.ghiChu+' ':'')+'Ý kiến CHP: '+note;
        R.status='da_duyet';R.duyet={at:Date.now(),date:today(),boi:ME.name||BB_CHP};recalc();
        const fl={...files,sigDuyet:ME.profile.signature};
        await DB.saveBbp(R,fl,null);files=fl;paint();
        $('bvAct').querySelectorAll('input,button').forEach(x=>x.disabled=true);msg(`Đã duyệt ${R.so}.`,'ok');
        const blob=await bbMakePdf(all,R,photos,fl);await deliverFile(bbPdfName(R),blob,'application/pdf');
      }catch(e){msg('Không duyệt được: '+(e.code||e.message),'err');b.disabled=false;}};
  }
  if($('bvPdf'))$('bvPdf').onclick=async()=>{try{const blob=await bbMakePdf(all,R,photos,files);await deliverFile(bbPdfName(R),blob,'application/pdf');}catch(e){toast('Không tạo được PDF: '+(e.message||e));}};
  requestAnimationFrame(paint);
  return p;
}

async function viewQueue(){
  if(!U)return needLogin('Đăng nhập Google để xem phiếu đang chờ bạn ký.');
  if(!ME.member)return needMember();
  const all=await loadSlips();if(!all)return;
  const mine=all.filter(isMyTurn),waiting=all.filter(s=>s.status==='pending'&&!isMyTurn(s));
  app.innerHTML=`<div class="eyebrow">Cấp duyệt: ${esc(ME.roles.map(r=>ROLES[r]).join(', ')||'chưa gán vai trò')}</div><h2 style="margin:4px 0 0;font-size:26px;color:var(--navy)">Phiếu chờ tôi ký (${mine.length})</h2>
   ${!(ME.profile&&ME.profile.signature)?'<div class="warnbox" style="margin-top:12px"><b style="color:var(--bad)">Bạn chưa khai báo chữ ký.</b> <a href="#/ho-so">Khai báo chữ ký ngay</a> để có thể ký.</div>':''}
   <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">${mine.map(slipRow).join('')||'<p class="hint">Hiện không có phiếu nào đến lượt bạn.</p>'}</div>

async function viewAll(){
  if(!U)return needLogin('Đăng nhập Google để xem toàn bộ phiếu.');
  if(!ME.member)return needMember();
  let all=await loadSlips();if(!all)return;
  let fs='',fq='';
  const dk=s=>String(s.head.ngay_xuat||s.head.ngay||'');
  const gname=s=>s.type==='N'?'NCC · '+(who(s)||'Chưa rõ'):(who(s)||'Chưa rõ');
  const draw=()=>{
    const l=all.filter(s=>(!fs||s.status===fs)&&(!fq||(s.code+' '+who(s)+' '+(s.head.hang_muc||'')+' '+(s.head.so||'')).toLowerCase().includes(fq.toLowerCase())));
    const G={};l.forEach(s=>{(G[gname(s)]=G[gname(s)]||[]).push(s);});
    const names=Object.keys(G).sort((a,b)=>(a.startsWith('NCC')-b.startsWith('NCC'))||a.localeCompare(b,'vi'));
    const cols=ME.isAdmin?7:6;
    $('rows').innerHTML=names.map(g=>{const ss=G[g].sort((a,b)=>dk(a).localeCompare(dk(b))||String(a.createdAt).localeCompare(String(b.createdAt)));
      return `<tr class="grp"><td colspan="${cols}"><b>${esc(g)}</b> <span class="hint">· ${ss.length} phiếu</span></td></tr>`+ss.map(s=>`<tr>${ME.isAdmin?`<td><button class="btn line sm" data-del="${s.id}" style="color:var(--bad);border-color:var(--bad);min-height:32px;padding:0 10px">Xoá</button></td>`:''}<td><a href="#/phieu/${s.id}">${esc(s.code)}</a></td><td>${esc(FORMS[s.type].name)}</td><td>${esc(fmtD(dk(s)))}</td><td>${s.items.length}</td><td>${badge(s)}</td><td class="hint">${esc(s.head.hang_muc||'')}</td></tr>`).join('');}).join('')||`<tr><td colspan="${cols}" class="hint">Không có phiếu.</td></tr>`;
    $('cnt').textContent=l.length+' phiếu';$('bx').onclick=()=>exportXlsx(all);
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const s=all.find(x=>x.id===b.dataset.del);delSlip(s,()=>{all=all.filter(x=>x.id!==s.id);draw();});});};
  app.innerHTML=`<div class="eyebrow">Toàn bộ phiếu · xếp theo nhà thầu, phiếu mới nhất ở cuối</div><h2 style="margin:4px 0 12px;font-size:26px;color:var(--navy)">Tất cả phiếu</h2>
   <div class="row"><input id="fq" placeholder="Tìm mã phiếu, đội, hạng mục" style="max-width:280px" aria-label="Tìm phiếu"><select id="fs" style="max-width:190px" aria-label="Lọc trạng thái"><option value="">Mọi trạng thái</option><option value="pending">Đang chờ ký</option><option value="done">Đã hoàn tất</option><option value="rejected">Bị từ chối</option></select><span id="cnt" class="hint"></span><button class="btn blue sm" id="bx" style="margin-left:auto">Xuất Excel thống kê theo nhà thầu</button></div>
   <div class="panel scroll" style="margin-top:12px"><table class="t"><thead><tr>${ME.isAdmin?'<th></th>':''}<th>Mã phiếu</th><th>Loại</th><th>Ngày</th><th>Dòng</th><th>Trạng thái</th><th>Hạng mục</th></tr></thead><tbody id="rows"></tbody></table></div>`;
  $('fq').oninput=e=>{fq=e.target.value;draw();};$('fs').onchange=e=>{fs=e.target.value;draw();};draw();
}

/* ===================== Khai báo chữ ký ===================== */
function viewProfile(){
  if(!U)return needLogin('Đăng nhập Google để khai báo chữ ký.');
  if(!ME.member)return needMember();
  const sig=ME.profile&&ME.profile.signature;
  app.innerHTML=`<div class="eyebrow">Hồ sơ cấp duyệt</div><h2 style="margin:4px 0 0;font-size:26px;color:var(--navy)">Chữ ký của tôi</h2>
   <section class="panel"><h2>Thông tin</h2><p class="hint" style="color:var(--ink);margin:0"><b>${esc(ME.name)}</b> · ${esc(U.email)}<br>Vai trò: ${esc(ME.roles.map(r=>ROLES[r]).join(', ')||'chưa được gán, liên hệ quản trị')}</p>
    <label class="f" for="pname">Họ tên hiển thị trên phiếu<input id="pname" value="${esc(ME.name)}"></label></section>
   <section class="panel"><h2>${sig?'Chữ ký đã khai báo':'Chưa có chữ ký'}</h2>${sig?`<div class="sigprev"><img src="${sig}" alt="Chữ ký hiện tại"></div>`:'<p class="hint">Vẽ chữ ký một lần. Các lần sau bạn chỉ cần bấm Ký.</p>'}
    <h2 style="font-size:15px">${sig?'Ký lại để thay chữ ký':'Ký tên vào khung'}</h2><div id="padHost"></div>
    <label class="f" for="sigfile" style="margin-top:4px">Hoặc tải ảnh chữ ký (chụp trên giấy trắng, tự tách nét, bỏ nền giấy)<input id="sigfile" type="file" accept="image/*"></label><div id="sigup"></div>
    <div class="row"><button class="btn red" id="save">Lưu chữ ký</button><span id="msg" class="msg" hidden></span></div></section>`;
  const pad=sigPad($('padHost'));let upSig=null;
  const setMsg=(t,k)=>{$('msg').hidden=!t;$('msg').textContent=t||'';$('msg').className='msg '+(k||'');};
  $('sigfile').onchange=async()=>{const f=$('sigfile').files[0];if(!f)return;try{upSig=await imgToSig(f);$('sigup').innerHTML='<p class="hint" style="margin:6px 0">Chữ ký từ ảnh (bấm Lưu chữ ký để dùng):</p><div class="sigprev"><img src="'+upSig+'" alt="Chữ ký từ ảnh"></div>';setMsg('');}catch(x){upSig=null;setMsg('Không đọc được ảnh: '+x.message,'err');}};
  $('save').onclick=async()=>{
    const name=$('pname').value.trim();if(!name){setMsg('Nhập họ tên hiển thị.','err');return;}
    if(pad.empty()&&!sig&&!upSig){setMsg('Chưa có chữ ký, hãy ký trong khung hoặc tải ảnh.','err');return;}
    $('save').disabled=true;
    try{
      const data=upSig||(pad.empty()?sig:pad.data());
      await DB.saveProfile(U.uid,{signature:data,name,email:U.email,updatedAt:new Date().toISOString()});
      if(name!==ME.name&&ME.allowed){try{await DB.setAllowed(U.email,{...ME.allowed,name});}catch(e){}}
      ME.profile={...(ME.profile||{}),signature:data,name};ME.name=name;renderChrome();toast('Đã lưu chữ ký.');viewProfile();
    }catch(e){setMsg('Không lưu được: '+(e.code||e.message),'err');$('save').disabled=false;}
  };
}

   <section class="panel"><h2>Bộ đếm số phiếu</h2><p class="hint">Mã phiếu tự sinh dạng HH12_TÊN-ĐỘI_001. Bấm nút dưới để bộ đếm của từng đội tiếp nối số phiếu đã có (làm 1 lần, bấm lại không hại).</p><div class="row"><button class="btn blue sm" id="syncSeq">Đồng bộ bộ đếm với phiếu cũ</button><span id="syncMsg" class="hint"></span></div></section>
   <section class="panel"><h2>Thêm người ký</h2><div class="grid"><label class="f">Email Google<input id="ne" type="email" placeholder="ten@gmail.com" autocomplete="off"></label><label class="f">Họ tên<input id="nn" placeholder="Nguyễn Văn A"></label></div>${roleBox('__new',[])}<div class="row"><button class="btn blue" id="add">Thêm</button><span id="msg" class="msg" hidden></span></div></section>
