/* ===================== Thống kê thiết bị theo nhà thầu ===================== */
async function viewStats(){
  if(!U)return needLogin('Đăng nhập Google để xem thống kê thiết bị.');
  if(!ME.member)return needMember();
  const all=await loadSlips();if(!all)return;
  const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n;};
  const fmtN=n=>Number.isInteger(n)?String(n):String(Math.round(n*100)/100);
  let incl=false,q='',open=null,d1='',d2='';
  const calc=()=>{
    const G={};
    all.filter(s=>s.type!=='N'&&(incl?s.status!=='rejected':s.status==='done')).forEach(s=>{
      const dt=s.head.ngay_xuat||s.head.ngay||'';if((d1&&dt<d1)||(d2&&dt>d2))return;
      const g=who(s)||'Chưa rõ';const o=G[g]=G[g]||{name:g,x:0,t:0,d:0,items:{},slips:[]};o.slips.push(s);
      s.items.forEach(i=>{const sl=num(i.sl);if(!sl)return;const cc=CAT.find(x=>x[0]===i.ma),dv=cc?cc[2]:i.dvt;const k=(i.ma||'')+'|'+i.ten+'|'+dv;const it=o.items[k]=o.items[k]||{ma:i.ma||'',ten:i.ten,dvt:dv,x:0,t:0,d:0};
        if(s.type==='A'){it.x+=sl;o.x+=sl;}else if(s.type==='D'){it.d+=sl;o.d+=sl;}else{it.t+=sl;o.t+=sl;}});
    });
    return Object.values(G).sort((a,b)=>a.name.localeCompare(b.name,'vi'));
  };
  const draw=()=>{
    const gs=calc().filter(g=>!q||g.name.toLowerCase().includes(q.toLowerCase()));
    const tx=gs.reduce((a,g)=>a+g.x,0),tt=gs.reduce((a,g)=>a+g.t,0),td=gs.reduce((a,g)=>a+g.d,0);
    $('stsum').innerHTML=`<div><b>${gs.length}</b><span>Nhà thầu</span></div><div><b>${fmtN(tx)}</b><span>Tổng xuất</span></div><div><b>${fmtN(tt)}</b><span>Tổng trả</span></div><div><b>${fmtN(tx-tt)}</b><span>Còn tại đội</span></div><div><b>${fmtN(td)}</b><span>Dự trù</span></div>`;
    $('stlist').innerHTML=gs.map(g=>{const on=open===g.name;const ci=r=>{let k=CAT.findIndex(c=>c[0]===r.ma);if(k<0){const m=String(r.ten).match(/\(([A-Z0-9-]+)\)\s*$/);if(m)k=CAT.findIndex(c=>c[0]===m[1]);}return k<0?99:k;};const rows=Object.values(g.items).sort((a,b)=>ci(a)-ci(b)||a.ten.localeCompare(b.ten,'vi'));
      return `<div class="panel" style="padding:0"><button class="stbtn" data-g="${esc(g.name)}" aria-expanded="${on}" style="all:unset;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;width:100%;padding:14px 16px;cursor:pointer"><b style="font-size:17px;color:var(--navy)">${esc(g.name)}</b><span><span class="badge b-done">Xuất ${fmtN(g.x)}</span> <span class="badge b-pending">Trả ${fmtN(g.t)}</span> <span class="badge ${g.x-g.t>0?'b-rejected':'b-done'}">Còn ${fmtN(g.x-g.t)}</span>${g.d?` <span class="badge b-pending">Dự trù ${fmtN(g.d)}</span>`:''}</span></button>
      ${on?`<div class="scroll" style="padding:0 16px 14px"><table class="t"><thead><tr><th>Mã</th><th>Thiết bị</th><th>ĐVT</th><th>Xuất</th><th>Trả</th><th>Còn tại đội</th><th>Dự trù</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.ma)}</td><td>${esc(r.ten)}</td><td>${esc(r.dvt)}</td><td>${fmtN(r.x)}</td><td>${fmtN(r.t)}</td><td><b>${fmtN(r.x-r.t)}</b></td><td>${r.d?fmtN(r.d):''}</td></tr>`).join('')}</tbody></table><p class="hint">${g.slips.length} phiếu: ${g.slips.map(s=>`<a href="#/phieu/${s.id}">${esc(s.code)}</a>`).join(', ')}</p></div>`:''}</div>`;}).join('')||'<p class="hint">Chưa có phiếu nào đã ký xong.</p>';
    document.querySelectorAll('.stbtn').forEach(b=>b.onclick=()=>{open=open===b.dataset.g?null:b.dataset.g;draw();});
    $('stx').onclick=()=>exportXlsx(all.filter(s=>(incl?s.status!=='rejected':s.status==='done')));
  };
  app.innerHTML=`<div class="eyebrow">Theo dõi xuất / trả theo nhà thầu</div><h2 style="margin:4px 0 12px;font-size:26px;color:var(--navy)">Thống kê thiết bị</h2>
   <div class="row"><input id="stq" placeholder="Tìm nhà thầu" style="max-width:220px" aria-label="Tìm nhà thầu"><label class="hint">Từ <input type="date" id="std1" style="width:auto"></label><label class="hint">Đến <input type="date" id="std2" style="width:auto"></label>
   <label class="row" style="gap:6px"><input type="checkbox" id="stin" style="width:18px;height:18px;min-height:0"> Gồm phiếu chưa ký xong</label><button class="btn blue sm" id="stx" style="margin-left:auto">Xuất Excel theo nhà thầu</button></div>
   <div class="stats" id="stsum" style="margin:12px 0"></div><div id="stlist" style="display:flex;flex-direction:column;gap:10px"></div>
   <p class="hint">Xuất = phiếu xuất kho, Trả = phiếu trả kho, Dự trù = phiếu dự trù thiết bị (tính riêng, không trừ vào Còn tại đội). Không tính phiếu NCC. Còn tại đội = xuất trừ trả, cộng theo từng thiết bị. Bấm vào tên nhà thầu để xem chi tiết.</p>`;
  $('stq').oninput=e=>{q=e.target.value;draw();};$('std1').onchange=e=>{d1=e.target.value;draw();};$('std2').onchange=e=>{d2=e.target.value;draw();};$('stin').onchange=e=>{incl=e.target.checked;draw();};
  draw();
}

/* ===================== Định tuyến ===================== */
function route(){
  if(unwatch){try{unwatch();}catch(e){}unwatch=null;}
  const parts=location.hash.replace(/^#\/?/,'').split('/');
  const p=parts[0]||'';
  renderChrome();window.scrollTo(0,0);
  if(p==='')return viewHome();
  if(p==='tao')return viewCreate('kho');
  if(p==='ncc')return viewCreate('ncc');
  if(p==='phieu'&&parts[1])return viewSlip(parts[1]);
  if(p==='duyet')return viewQueue();
  if(p==='tatca')return viewAll();
  if(p==='thong-ke')return viewStats();
  if(p==='thep-nhap')return viewSteelUpload();
  if(p==='thep-tonghop')return viewSteelSummary();
  if(p==='bien-ban')return viewBbp(parts[1]);
  if(p==='vat-tu')return viewVatTu();
  if(p==='ho-so')return viewProfile();
  if(p==='quan-tri')return viewAdmin();
  viewHome();
}
window.addEventListener('hashchange',route);

/* ===================== Trình duyệt trong Zalo ===================== */
(function(){
  const ua=navigator.userAgent||'';
  if(!/Zalo|FBAN|FBAV|Messenger|Line\/|Instagram|MicroMessenger/i.test(ua))return;
  const isAndroid=/Android/i.test(ua),isIOS=/iPhone|iPad|iPod/i.test(ua);
  $('inapp').hidden=false;
  $('inappText').textContent=isAndroid?'Zalo chặn tải file và đăng nhập Google. Bấm nút "Mở bằng Chrome" bên dưới.':isIOS?'Zalo chặn tải file và đăng nhập Google. Bấm dấu ··· (hoặc biểu tượng chia sẻ) ở góc màn hình, chọn "Mở bằng Safari". Hoặc bấm "Sao chép liên kết", mở Safari rồi dán vào.':'Zalo chặn tải file và đăng nhập Google. Mở liên kết này bằng Chrome hoặc Edge.';
  const intent=()=>{const sch=location.protocol.slice(0,-1);location.href='intent://'+location.host+location.pathname+location.search+location.hash+'#Intent;scheme='+sch+';package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(location.href)+';end';};
  if(isAndroid){$('openChrome').hidden=false;$('openChrome').onclick=intent;let done=false;try{done=sessionStorage.getItem('triedChrome');sessionStorage.setItem('triedChrome','1');}catch(e){}if(!done)setTimeout(intent,400);}
  $('copyLink').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);}catch(e){const t=document.createElement('textarea');t.value=location.href;document.body.appendChild(t);t.select();try{document.execCommand('copy');}catch(_){}t.remove();}$('copyMsg').textContent='Đã sao chép. Mở Chrome hoặc Safari và dán vào thanh địa chỉ.';};
})();

/* ===================== Khởi động ===================== */
(async function boot(){
  renderChrome();
  try{
    if(MOCK)DB=initMock();
    else if(FB_CONFIG)DB=await initFirebase();
    else{app.innerHTML='<div class="panel"><h2>Chưa cấu hình Firebase</h2><p class="hint">Trang chưa được nối với dự án Firebase.</p></div>';return;}
  }catch(e){app.innerHTML=`<div class="panel"><h2>Không kết nối được Firebase</h2><p class="hint">${esc(e.message||e)}. Kiểm tra mạng rồi tải lại trang.</p></div>`;return;}
  let first=true;
  DB.onAuth(u=>{if(first){first=false;}onAuth(u);});
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!MOCK)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
